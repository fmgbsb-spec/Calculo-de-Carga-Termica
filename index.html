<script>(function () {
  // _publicacao-web: registra o service worker (app instalável e offline) só quando a página vem por
  // https ou do servidor local de teste; aberta por arquivo, nada muda. data-sw no <html> serve ao teste.
  var h = document.documentElement, l = location;
  var seguro = l.protocol === 'https:' || l.hostname === 'localhost' || l.hostname === '127.0.0.1';
  if (!seguro || !('serviceWorker' in navigator)) { h.setAttribute('data-sw', 'indisponivel'); return; }
  h.setAttribute('data-sw', navigator.serviceWorker.controller ? 'ativo' : 'registrando');
  navigator.serviceWorker.register('sw.js', { scope: './' }).then(function () {
    if (!navigator.serviceWorker.controller) h.setAttribute('data-sw', 'instalado');
  }, function () { h.setAttribute('data-sw', 'erro'); });
  // Pede ao navegador para não apagar os dados do app por falta de espaço ou de uso.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () { });
})();</script>

<!-- Plataforma comum (_plataforma-hvac): tokens, base, componentes e folha do memorial. O build embute tudo no HTML único. -->
<style>
/* ==== plataforma v0.4.0: css/base.css ==== */
/* Plataforma HVAC: tokens de tema, base e componentes comuns aos apps.
   Regra do guia: nenhum valor de cor fora dos blocos de tokens. Cor própria de um app entra no CSS do app. */
:root {
  --fundo: #f3f0e8; --sup: #fffdf8; --sup2: #f8f5ee; --linha: #ddd6c7; --linha-forte: #bfb6a3;
  --tinta: #1b2829; --tinta2: #4a5b5c; --tinta3: #768485;
  --prim: #0e5f59; --prim-tinta: #ffffff; --prim-suave: #d9e9e5;
  --norma-f: #e6ecd6; --norma-t: #42511c;
  --alt-f: #fbe7c2; --alt-t: #744600;
  --calc-f: #e8e4db; --calc-t: #4a5b5c;
  --demo-f: #e7e0f3; --demo-t: #4a3879;
  --erro: #b3261e; --alerta: #8a5200; --ok: #2c6b2f;
  --sombra: 0 1px 2px rgba(27, 40, 41, .06), 0 8px 24px rgba(27, 40, 41, .07);
  --raio: 12px; --fonte: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fonte-titulo: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  /* Cores que valem igual nos dois temas: véu das janelas, variação da faixa e a folha do memorial (papel branco). */
  --veu: rgba(10, 16, 16, .45); --faixa-delta: rgba(127, 127, 127, .3);
  --folha-fundo: #fff; --folha-tinta: #1b1b1b; --folha-tinta2: #555; --folha-linha: #d5d5d5;
  color-scheme: light;
}
:root[data-tema="escuro"] {
  --fundo: #121819; --sup: #1a2223; --sup2: #212b2c; --linha: #2f3b3c; --linha-forte: #465758;
  --tinta: #e8eeec; --tinta2: #b4c1c0; --tinta3: #8b9a99;
  --prim: #5fc4b8; --prim-tinta: #0b1f1d; --prim-suave: #1e3936;
  --norma-f: #2c3520; --norma-t: #c9d8a2;
  --alt-f: #45330f; --alt-t: #f3cf8a;
  --calc-f: #2a3334; --calc-t: #b4c1c0;
  --demo-f: #2f2945; --demo-t: #cbbdf0;
  --erro: #ff8a80; --alerta: #f0b862; --ok: #8fd694;
  --sombra: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--fundo); color: var(--tinta); font: 15px/1.5 var(--fonte); padding-bottom: 76px; }
h1, h2, h3 { font-family: var(--fonte-titulo); line-height: 1.2; margin: 0; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 650; letter-spacing: -.01em; }
h2 { font-size: 19px; font-weight: 650; }
h3 { font-size: 15px; font-weight: 650; }
p { margin: 0; }
a { color: var(--prim); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--prim); outline-offset: 2px; border-radius: 6px; }
.num { font-variant-numeric: tabular-nums; }
.suave { color: var(--tinta2); }
.fraco { color: var(--tinta3); font-size: 13px; }
.oculto { display: none !important; }

/* ---------- Topo e trilha ---------- */
.topo { position: sticky; top: 0; z-index: 20; background: var(--sup); border-bottom: 1px solid var(--linha); }
.topo-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 8px; font-family: var(--fonte-titulo); font-weight: 700; text-decoration: none; color: var(--tinta); white-space: nowrap; }
.marca svg { width: 26px; height: 26px; }
.marca small { font-weight: 500; color: var(--tinta3); font-size: 12px; }
.topo-acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icone { background: none; border: 1px solid transparent; border-radius: 8px; padding: 6px 10px; color: var(--tinta2); font-size: 13px; white-space: nowrap; }
.icone:hover { background: var(--sup2); border-color: var(--linha); }
.icone[aria-pressed="true"] { background: var(--prim-suave); color: var(--prim); border-color: transparent; font-weight: 600; }
kbd { font: 11px var(--fonte); border: 1px solid var(--linha-forte); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; color: var(--tinta2); background: var(--sup); }

.trilha { max-width: 1040px; margin: 0 auto; padding: 0 16px 10px; display: flex; gap: 4px; list-style: none; overflow-x: auto; }
.trilha li { flex: 1 1 0; min-width: 118px; }
.trilha a { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; text-decoration: none; color: var(--tinta2); border: 1px solid transparent; }
.trilha a:hover { background: var(--sup2); }
.trilha .n { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--linha-forte); display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.trilha .t { display: block; font-weight: 600; font-size: 14px; line-height: 1.2; white-space: nowrap; }
.trilha .s { display: block; font-size: 12px; color: var(--tinta3); white-space: nowrap; }
.trilha a[aria-current="page"] { background: var(--prim-suave); color: var(--tinta); }
.trilha a[aria-current="page"] .n { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.trilha .pend .s { color: var(--alerta); }

/* ---------- Estrutura da tela ---------- */
main { max-width: 860px; margin: 0 auto; padding: 28px 16px 40px; }
main.larga { max-width: 1040px; }
.cabeca { margin-bottom: 20px; }
.cabeca .sobre { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--prim); margin-bottom: 6px; }
.cabeca p { color: var(--tinta2); margin-top: 6px; max-width: 62ch; }
.cartao { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); padding: 18px; margin-bottom: 14px; }
.cartao > h2 { margin-bottom: 12px; }
.grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px 18px; }
.grade.g2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
.grade:not(.g2) > .campo { max-width: 300px; }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.botao { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--linha-forte); background: var(--sup); border-radius: 10px; padding: 8px 14px; font-weight: 600; text-decoration: none; color: var(--tinta); }
.botao:hover { border-color: var(--prim); }
.botao.prim { background: var(--prim); border-color: var(--prim); color: var(--prim-tinta); }
.botao.leve { border-color: transparent; background: none; color: var(--prim); padding: 6px 8px; }
.botao.perigo:hover { border-color: var(--erro); color: var(--erro); }
.aviso { border-left: 3px solid var(--demo-t); background: var(--demo-f); color: var(--demo-t); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin-bottom: 14px; }
.aprender { border-left: 3px solid var(--prim); background: var(--prim-suave); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 14px; margin: 0 0 14px; }
.aprender b { color: var(--prim); }

/* ---------- Campo com estado ---------- */
.campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.campo label, .rotulo { font-size: 13px; font-weight: 600; color: var(--tinta2); }
.entrada { display: flex; align-items: stretch; border: 1px solid var(--linha-forte); border-radius: 10px; background: var(--sup); overflow: hidden; }
.entrada:focus-within { border-color: var(--prim); box-shadow: 0 0 0 3px var(--prim-suave); }
.entrada input, .entrada select { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 11px; outline: none; font-size: 15px; }
.entrada input.num { text-align: right; font-weight: 600; }
.entrada .un { display: grid; place-items: center; padding: 0 10px; font-size: 13px; color: var(--tinta3); background: var(--sup2); border-left: 1px solid var(--linha); white-space: nowrap; }
.entrada.fixo { background: var(--sup2); border-style: dashed; }
.entrada.fixo input { color: var(--tinta2); }
.campo.invalido .entrada { border-color: var(--erro); }
.estado { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 22px; }
.selo { display: inline-flex; align-items: center; gap: 4px; border: 0; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.selo.norma { background: var(--norma-f); color: var(--norma-t); }
.selo.alterado { background: var(--alt-f); color: var(--alt-t); }
.selo.calc { background: var(--calc-f); color: var(--calc-t); }
.selo.demo { background: var(--demo-f); color: var(--demo-t); }
.selo.mantido { background: var(--prim-suave); color: var(--prim); }
button.selo:hover { filter: brightness(.95); text-decoration: underline; }
.voltar { border: 0; background: none; color: var(--tinta2); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.msg { font-size: 12.5px; color: var(--alerta); }
.campo.invalido .msg { color: var(--erro); }
.seg { display: inline-flex; border: 1px solid var(--linha-forte); border-radius: 10px; overflow: hidden; background: var(--sup); }
.seg button { border: 0; background: none; padding: 8px 12px; font-size: 14px; border-right: 1px solid var(--linha); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--prim); color: var(--prim-tinta); font-weight: 600; }
.valor-calc { display: inline-flex; align-items: baseline; gap: 6px; border: 1px dashed var(--linha-forte); background: var(--sup2); border-radius: 10px; padding: 8px 11px; font-weight: 650; color: var(--tinta); text-align: left; }
.valor-calc:hover { border-color: var(--prim); }
.valor-calc small { font-weight: 500; color: var(--tinta3); }

/* ---------- Bloco recolhível (frase-resumo) ---------- */
.bloco { background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.bloco-cab { width: 100%; display: grid; grid-template-columns: 30px 1fr auto 18px; gap: 12px; align-items: center; padding: 14px 16px; background: none; border: 0; text-align: left; border-radius: var(--raio); }
.bloco-cab:hover { background: var(--sup2); }
.bloco-cab .n { width: 28px; height: 28px; border-radius: 50%; background: var(--prim-suave); color: var(--prim); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.bloco-cab .tit { font-weight: 650; font-size: 16px; display: block; }
.bloco-cab .frase { color: var(--tinta2); font-size: 14px; display: block; }
.bloco-cab .carga { text-align: right; font-weight: 650; white-space: nowrap; }
.bloco-cab .carga small { display: block; font-weight: 500; color: var(--tinta3); font-size: 12px; }
.bloco-cab .seta { color: var(--tinta3); transition: transform .15s; }
.bloco.aberto .bloco-cab .seta { transform: rotate(90deg); }
.bloco.aberto { border-color: var(--linha-forte); box-shadow: var(--sombra); }
.bloco-corpo { padding: 4px 16px 18px 58px; }
.sub { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--linha); }
.sub > h3 { margin-bottom: 10px; }
details.mais { margin-top: 16px; border-top: 1px solid var(--linha); padding-top: 12px; }
details.mais > summary { cursor: pointer; font-weight: 600; color: var(--prim); font-size: 14px; }
details.mais > .grade { margin-top: 12px; }

/* ---------- Lista de ambientes (linha: nome, indicadores e ações; o app pode trocar as colunas) ---------- */
.amb-item { display: grid; grid-template-columns: 1fr auto auto; gap: 16px; align-items: center; padding: 14px 16px; background: var(--sup); border: 1px solid var(--linha); border-radius: var(--raio); margin-bottom: 10px; }
.amb-item:hover { border-color: var(--prim); }
.amb-item a.nome { font-weight: 650; font-size: 16px; color: var(--tinta); text-decoration: none; }
.amb-item a.nome:hover { color: var(--prim); text-decoration: underline; }
.amb-item .kpi { text-align: right; }
.amb-item .kpi b { font-size: 18px; }

/* ---------- Tabelas ---------- */
.tabela-rolo { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--linha); text-align: left; vertical-align: top; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--tinta3); font-weight: 700; white-space: nowrap; }
td.num, th.num { text-align: right; white-space: nowrap; }
tr.total td { font-weight: 700; border-top: 2px solid var(--linha-forte); }
tr.clicavel { cursor: pointer; }
tr.clicavel:hover td { background: var(--sup2); }
.x { border: 0; background: none; color: var(--tinta3); font-size: 18px; padding: 6px; border-radius: 6px; }
.x:hover { color: var(--erro); background: var(--sup2); }

/* ---------- Número em destaque, indicadores, barras, cartões e lista de pendências ---------- */
.heroi-res { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.numero { font-family: var(--fonte-titulo); font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.numero small { font-size: 24px; font-weight: 600; color: var(--tinta2); letter-spacing: 0; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi-c { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; background: var(--sup2); text-align: left; }
button.kpi-c:hover { border-color: var(--prim); }
.kpi-c span { display: block; font-size: 12px; color: var(--tinta3); font-weight: 600; }
.kpi-c b { font-size: 18px; }
.barras { display: grid; grid-template-columns: minmax(150px, 230px) 1fr 84px 52px; gap: 6px 12px; align-items: center; font-size: 14px; }
.barras .linha-b { display: contents; cursor: pointer; }
.barras .linha-b:hover .nome { color: var(--prim); text-decoration: underline; }
.barras .trilho { height: 14px; position: relative; }
.barras .barra { position: absolute; top: 0; bottom: 0; background: var(--prim); border-radius: 0 4px 4px 0; min-width: 2px; }
.barras .barra.neg { background: var(--tinta3); border-radius: 4px 0 0 4px; }
.barras .eixo { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--linha-forte); }
.barras .v, .barras .p { text-align: right; font-variant-numeric: tabular-nums; }
.barras .p { color: var(--tinta3); }
.pesos { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.peso { border: 1px solid var(--linha); border-radius: 10px; padding: 12px; }
.peso b { display: block; font-size: 22px; font-family: var(--fonte-titulo); }
.pend { list-style: none; padding: 0; margin: 0; }
.pend li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.pend li:last-child { border-bottom: 0; }

/* ---------- Faixa de resultado ---------- */
.faixa { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--tinta); color: var(--fundo); }
.faixa-linha { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
.faixa .item span { display: block; font-size: 11px; opacity: .7; text-transform: uppercase; letter-spacing: .05em; }
.faixa .item b { font-size: 18px; font-variant-numeric: tabular-nums; }
.faixa .delta { font-size: 13px; border-radius: 999px; padding: 3px 10px; background: var(--faixa-delta); }
.faixa a { margin-left: auto; color: inherit; font-weight: 600; text-decoration: none; border: 1px solid currentColor; border-radius: 10px; padding: 7px 12px; }

/* ---------- Gaveta, paleta e janela ---------- */
.veu { position: fixed; inset: 0; background: var(--veu); z-index: 40; }
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--sup); z-index: 41; box-shadow: var(--sombra); display: flex; flex-direction: column; }
.gaveta header { padding: 18px 20px 12px; border-bottom: 1px solid var(--linha); display: flex; gap: 12px; align-items: flex-start; }
.gaveta header div { flex: 1; }
.gaveta .corpo { padding: 16px 20px 28px; overflow: auto; }
.gaveta .valor-g { font-family: var(--fonte-titulo); font-size: 30px; font-weight: 700; }
.passo { border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.passo .q { font-weight: 650; display: flex; justify-content: space-between; gap: 12px; }
.passo .f { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; color: var(--tinta2); margin-top: 2px; overflow-wrap: anywhere; }
.passo .fo { font-size: 12.5px; color: var(--tinta3); margin-top: 4px; }
.janela { position: fixed; top: 12vh; left: 50%; transform: translateX(-50%); width: min(640px, calc(100vw - 24px)); max-height: 76vh; overflow: auto; background: var(--sup); z-index: 41; border-radius: 14px; box-shadow: var(--sombra); padding: 16px; }
.janela h2 { margin-bottom: 10px; }
.paleta input { width: 100%; border: 1px solid var(--linha-forte); border-radius: 10px; padding: 10px 12px; background: var(--sup); font-size: 16px; }
.paleta ul { list-style: none; margin: 10px 0 0; padding: 0; }
.paleta li button { width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; display: flex; justify-content: space-between; gap: 10px; }
.paleta li button.ativo, .paleta li button:hover { background: var(--prim-suave); }

@media (max-width: 760px) {
  h1 { font-size: 23px; }
  .trilha .s { display: none; }
  .trilha li { min-width: 0; }
  .trilha .t { font-size: 13px; }
  .topo-acoes .txt { display: none; }
  .bloco-corpo { padding-left: 16px; }
  .bloco-cab { grid-template-columns: 30px 1fr 18px; }
  .bloco-cab .carga { grid-column: 2; text-align: left; }
  .bloco-cab .carga small { display: inline; margin-left: 6px; }
  .heroi-res { grid-template-columns: 1fr; gap: 14px; }
  .numero { font-size: 48px; }
  .barras { display: block; }
  .barras .linha-b { display: grid; grid-template-columns: 1fr auto 44px; gap: 3px 10px; margin-bottom: 10px; }
  .barras .trilho { grid-column: 1 / -1; grid-row: 2; }
  .faixa-linha { gap: 14px; }
  .faixa .item.sec { display: none; }
  .amb-item { grid-template-columns: 1fr; }
  .amb-item .kpi { text-align: left; }
}

/* ---------- Celular (v0.4.0; especificação aprovada na sessão M0, itens C1 a C17) ----------
   Regra que muda elemento que já existe: só sob @media screen and (max-width: 760px). O "screen" é obrigatório: sem ele o
   navegador aplica a regra também na impressão e o PDF muda (achado da M0). A regra estreita acima (sem "screen") fica como está.
   Elemento novo (cel-*) nasce oculto aqui e só aparece em tela estreita: no computador não ocupa nenhum pixel. */
.cel-menu, .cel-passos, .cel-dica, .cel-cartoes, .cel-rolar { display: none; }
/* .so-celular: só em tela estreita (some no computador e no papel); .so-computador: some em tela estreita */
@media not screen and (max-width: 760px) { .so-celular { display: none !important; } }
/* Seletor de arquivo de projeto sobre um botão, invisível (input[type=file][data-arquivo-projeto] dentro de .arquivo-projeto):
   o seletor escondido com display:none e acionado por código falha em alguns celulares */
.arquivo-projeto { position: relative; overflow: hidden; cursor: pointer; }
.arquivo-projeto input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; font-size: 16px; cursor: pointer; }

@media screen and (max-width: 760px) {
  .so-computador { display: none !important; }

window.HVAC = window.HVAC || {};
(function (H) {

  window.onerror = function (msg, arq, linha) {

(function (H) {
  'use strict';
  var b = H.dados.bruto;

  });

    return { nome: l.sombreamento, fonte: l.fonte };
  });

<script>
/* ==== js/dados/tabelas_motor.js ==== */
/* Converte H.dados.brutoMotor (texto vindo dos CSV) nos dados do motor: perfil da ABNT NBR 16401-1:2024 Tabela A.8 (PDF p. 64), clima de Brasília (anual e mensal),
   séries CTS/RTS, vidros e IAC. Dados da planilha v1.0.5. */
(function (H) {
  'use strict';
  var b = H.dados.brutoMotor;

  // Perfil diário da NBR 16401-1:2024 Tabela A.8, hora 1 a 24
  var perfilDiario = b.perfilDiario.slice().sort(function (x, y) { return Number(x.hora) - Number(y.hora); })
    .map(function (l) { return Number(l.f); });

  // Clima: toda linha de valor numérico (a linha "cidade" fica fora)
  var clima = {}, climaFonte = {};
  b.climaLocal.forEach(function (l) {
    var v = Number(l.valor);
    if (l.valor !== '' && !isNaN(v)) { clima[l.chave] = v; climaFonte[l.chave] = l.fonte; }
  });

  // Séries CTS (ASHRAE 2021 cap. 18 Tabelas 16 e 17), em fração: a planilha faz CTS_dados/100
  var cts = {};
  b.ctsParedes.concat(b.ctsCoberturas).forEach(function (l) {
    var c = [];
    for (var n = 0; n < 24; n++) c.push(Number(l['c' + n]) / 100);
    cts[l.id] = { id: l.id, descricao: l.descricao, fonte: l.fonte, c: c };
  });

  // Séries RTS não solar (ASHRAE 2021 cap. 18 Tabela 19), uma por zona, em fração: a planilha faz RTS_ns/100.
  // Cabeçalho do CSV = chave da zona; uma linha por n (0 a 23)
  function seriesRts(linhas) {
    var r = {};
    linhas.slice().sort(function (x, y) { return Number(x.n) - Number(y.n); }).forEach(function (l) {
      Object.keys(l).forEach(function (k) {
        if (k === 'n') return;
        if (!r[k]) r[k] = [];
        r[k].push(Number(l[k]) / 100);
      });
    });
    return r;
  }
  var rtsNs = seriesRts(b.rtsNaoSolar);
  // Séries RTS solar (ASHRAE 2021 cap. 18 Tabela 20), 18 zonas, mesma forma (a planilha faz RTS_sol/100)
  var rtsSol = seriesRts(b.rtsSolar);

  // Vidros (ASHRAE Fundamentals 2021 cap. 15 Tabela 10, p. 15.22 a 15.29: SHGC a 0, 40, 50, 60, 70 e 80° e SHGC difuso; Tabela 4, p. 15.9 e 15.10: U típico); a planilha busca pela descrição
  var vidros = b.vidros.map(function (l) {
    return { id: l.id, nome: l.descricao,
      shgc: [Number(l.SHGC_0), Number(l.SHGC_40), Number(l.SHGC_50), Number(l.SHGC_60), Number(l.SHGC_70), Number(l.SHGC_80)],
      shgcDifuso: Number(l.SHGC_difuso), U: Number(l.U_tipico_W_m2K), fonte: l.fonte };
  });
  var vidrosPor = {};
  vidros.forEach(function (v) { vidrosPor[v.nome] = v; });

  /* IAC e fração radiante do sombreamento interno por vidro e dispositivo (ASHRAE 2021 cap. 15 Tabelas 14A, 14B e 14G; planilha v1.0.5,
     aba Tab_IAC). Chave = id do vidro (Tabela 10) + '|' + nome do dispositivo. iac0 = incidência normal, iac60 = ângulo de perfil ≥ 60°,
     iacDif = difusa, fr = fração radiante do dispositivo. Vidro reflexivo e dispositivo não tabelado: sem linha (sem crédito) */
  var iacPor = {};
  b.iac.forEach(function (l) {
    iacPor[l.vidro + '|' + l.dispositivo] = { vidro: l.vidro, dispositivo: l.dispositivo, iac0: Number(l.IAC0), iac60: Number(l.IAC60),
      iacDif: Number(l.IACdif), fr: Number(l.FR), fonte: l.fonte };
  });

  /* Clima mensal de Brasília (ASHRAE Climatic Design Conditions 2021, estação 833780; planilha v1.0.5, aba Tab_ClimaMes), 12 linhas (mês 1 a 12):
     db_k, mcwb_k, wb_k, mcdb_k para k = 2, 5, 10 (percentil mensal 2 %, 5 %, 10 %), mdbr (K), tau_b e tau_d do mês. CONFERIR com a folha oficial */
  var climaMensal = b.climaMensal.map(function (l) {
    var o = { fonte: l.fonte };
    Object.keys(l).forEach(function (k) { if (k !== 'fonte') o[k] = Number(l[k]); });
    return o;
  }).sort(function (x, y) { return x.mes - y.mes; });
  if (climaMensal.length !== 12) throw new Error('clima mensal: esperadas 12 linhas, achadas ' + climaMensal.length);

  // Frações radiantes (ASHRAE Fundamentals 2021 cap. 18 Tabela 14, p. 18.24), pela ordem das linhas do CSV (como a planilha cria os nomes Frac_*)
  var fr = b.fracoesRadiantes.map(function (l) { return Number(l.fracao_radiante); });
  if (fr.length !== 9) throw new Error('ASHRAE Fundamentals 2021 cap. 18 Tabela 14 (frações radiantes): esperadas 9 linhas, achadas ' + fr.length);
  var fracRad = { pessoas: fr[0], equipVent: fr[1], equipSemVent: fr[2], parede: fr[3], cobertura: fr[4],
    vidroAlto: fr[5], vidroBaixo: fr[6], solar: fr[7], infiltracao: fr[8] };

  // Luminárias (ASHRAE 2021 cap. 18 Tabela 3): fração do calor que fica no espaço e fração radiante
  var luminarias = b.luminarias.map(function (l) {
    return { nome: l.luminaria, fracEspaco: Number(l.fracao_espaco), fracRad: Number(l.fracao_radiante), fonte: l.fonte };
  });
  var luminariasPor = {};
  luminarias.forEach(function (l) { luminariasPor[l.nome] = l; });

  // Perfis de ocupação/uso (planilha Perf_tab): 24 frações, hora 1 a 24
  var perfis = b.perfisOcupacao.map(function (l) {
    var f = [];
    for (var h = 1; h <= 24; h++) f.push(Number(l['h' + h]));
    return { nome: l.perfil, f: f, fonte: l.fonte };
  });
  var perfisPor = {};
  perfis.forEach(function (p) { perfisPor[p.nome] = p; });

  /* Composições: R = soma, de camada1 a camada6, do R_m2K_W das camadas não vazias (ASHRAE 2021 cap. 18 Tabela 18); id não achado
     conta 0, como o IFERROR(XLOOKUP(...); 0) da planilha (cltd aba_tabelas.ps1). U = 1/R; R = 0: sem entrada. */
  var rCamada = {};
  b.camadas.forEach(function (l) { rCamada[l.id] = Number(l.R_m2K_W); });
  var composicoesU = {};
  H.dados.bruto.composicoes.forEach(function (l) {
    var R = 0;
    for (var j = 1; j <= 6; j++) {
      var id = l['camada' + j];
      if (id !== '' && id !== undefined && rCamada[id] !== undefined && !isNaN(rCamada[id])) R += rCamada[id];
    }
    if (R !== 0) composicoesU[l.composicao] = { R: R, U: 1 / R };
  });

  /* Constantes que não são digitadas no app nem vêm de CSV (entradas fixas da aba Projeto da planilha v1.0.5,
     cltd src\aba_projeto.ps1 linhas 31-35, 40 e 41; nomes rho_g, aho_clara, aho_escura, dR_horiz, dR_vert, T_int, UR_int):
     rhoG  = refletância do solo, 0,2: ASHRAE 2021 cap. 14 (valor usual 0,2);
     ahoClara / ahoEscura = α/h_o das superfícies, 0,026 e 0,052 m²K/W: ASHRAE 2021 cap. 18, temperatura sol-ar, h_o = 17 W/m²K;
     dRHoriz / dRVert = εΔR/h_o, 4 K nas horizontais e 0 K nas verticais: ASHRAE 2021 cap. 18 eq. (29);
     tInt / urInt = 24 °C e 50 %: par adotado como padrão do app, editável (NBR 16401-1:2024 5.2.1 pede temperatura operativa e umidade dentro da
     zona de conforto da NBR 16401-2:2024, 6.3). */
  var constantes = { rhoG: 0.2, ahoClara: 0.026, ahoEscura: 0.052, dRHoriz: 4, dRVert: 0, tInt: 24, urInt: 50 };

  H.dados.motor = { perfilDiario: perfilDiario, clima: clima, climaFonte: climaFonte, cts: cts, rtsNs: rtsNs, rtsSol: rtsSol, vidros: vidros, vidrosPor: vidrosPor, iacPor: iacPor, climaMensal: climaMensal, fracRad: fracRad,
    luminarias: luminarias, luminariasPor: luminariasPor, perfis: perfis, perfisPor: perfisPor, composicoesU: composicoesU, constantes: constantes };
})(window.HVAC);
</script>

<script>
/* ==== js/motor/psicro.js ==== */
/* Psicrometria na pressão local (ASHRAE Fundamentals 2021 cap. 1): pressão, pws, w, densidade e ar padrão (1,2 kg/m³). Sem DOM.
   Usada pelo clima horário (clima.js), pelo ar exterior (ar_exterior.js) e pelos valores mostrados no memorial. */
(function (H) {
  'use strict';
  var RHO_PADRAO = 1.2;          // kg/m³, ar padrão
  var ALTITUDE = 1060;           // m, Brasília (planilha v1.0.5, aba Projeto)
  var T_INT = 24, UR_INT = 0.5;

  // Pressão atmosférica local, kPa: cap. 1 eq. (3)
  function pressao(z) { return 101.325 * Math.pow(1 - 2.25577e-5 * z, 5.2559); }

  // Pressão de saturação sobre água líquida, kPa: cap. 1 eq. (6), Hyland-Wexler (0 a 200 °C)
  function pws(t) {
    var T = t + 273.15;
    return Math.exp(-5.8002206e3 / T + 1.3914993 - 4.8640239e-2 * T + 4.1764768e-5 * T * T - 1.4452093e-8 * T * T * T + 6.5459673 * Math.log(T)) / 1000;
  }

  // Umidade absoluta, kg/kg, a partir da pressão parcial de vapor: cap. 1 eq. (20)
  function wDePw(pw, p) { return 0.621945 * pw / (p - pw); }

  // Umidade absoluta a partir de tbs e tbu: cap. 1 eq. (33); os termos 2501 e 1,86 vêm de ASHRAE Fundamentals 2021 cap. 1 Eq. (30), p. 1.10 (h = 1,006·t + W·(2501 + 1,86·t))
  function wDeTbsTbu(tbs, tbu, p) {
    var ws = wDePw(pws(tbu), p);
    return ((2501 - 2.326 * tbu) * ws - 1.006 * (tbs - tbu)) / (2501 + 1.86 * tbs - 4.186 * tbu);
  }

  // Densidade em base de ar seco, kg/m³ (inverso do volume específico): cap. 1 eq. (26)

<script>
/* ==== js/motor/solar.js ==== */
/* Posição solar e irradiância de céu claro (ASHRAE Fundamentals 2021 cap. 14: Eq. (16), massa de ar, p. 14.10; Eq. (26) a (31), direta, difusa e refletida em superfície inclinada, p. 14.11 e 14.12; Tabela 2), hora a hora de um dia de projeto.
   Reproduz conta por conta as abas Projeto e Solar da planilha carga-termica-cltd v1.0.5 (um bloco por mês: dia 21, τb e τd do mês). Sem DOM.
   Ângulos em graus nas entradas e saídas. Entrada p = { lat, lon, tz, nDia, tauB, tauD, rhoG }. */
(function (H) {
  'use strict';
  var ORIENTACOES = [
    { nome: 'Norte', psi: 180, sigma: 90 }, { nome: 'Nordeste', psi: -135, sigma: 90 }, { nome: 'Leste', psi: -90, sigma: 90 },
    { nome: 'Sudeste', psi: -45, sigma: 90 }, { nome: 'Sul', psi: 0, sigma: 90 }, { nome: 'Sudoeste', psi: 45, sigma: 90 },
    { nome: 'Oeste', psi: 90, sigma: 90 }, { nome: 'Noroeste', psi: 135, sigma: 90 }, { nome: 'Horizontal', psi: 0, sigma: 0 }
  ];
  // Dia 21 de cada mês: cap. 14 Tabela 2
  var DIA_DO_ANO = [21, 52, 80, 111, 141, 172, 202, 233, 264, 294, 325, 355];

  function rad(x) { return x * Math.PI / 180; }

     lsm = 15·tz: eq. (8); Eo = 1367·(1 + 0,033·cos(360·(n − 3)/365)): eq. (4);
     etMin: eq. (5) com g = 360·(n − 1)/365 (equação do tempo em min); decl = 23,45·sen(360·(n + 284)/365): eq. (10);
     ab, ad: eqs. (19) e (20). Numeração das equações como citada na planilha. */
  function derivados(p) {
    var n = p.nDia, tb = p.tauB, td = p.tauD, g = rad(360 * (n - 1) / 365);
    return {

      etMin: 2.2918 * (0.0075 + 0.1868 * Math.cos(g) - 3.2077 * Math.sin(g) - 1.4615 * Math.cos(2 * g) - 4.089 * Math.sin(2 * g)),
      decl: 23.45 * Math.sin(rad(360 * (n + 284) / 365)),

  }

  /* Posição do Sol e irradiância normal direta/difusa, 24 h (hora local 1 a 24).
     ast = h + ET/60 + (lon − lsm)/15; H = 15·(ast − 12)
     sen β = cos L·cos δ·cos H + sen L·sen δ
     φ = atan2(sen H·cos δ/cos β ; (cos H·cos δ·sen L − sen δ·cos L)/cos β), medido do Sul, positivo para Oeste
     m = 1/(sen β + 0,50572·(6,07995 + β)^−1,6364), β em graus (Kasten-Young); Eb = Eo·exp(−τb·m^ab), Ed = Eo·exp(−τd·m^ad)

      var sb = Math.cos(L) * Math.cos(dl) * Math.cos(Hr) + Math.sin(L) * Math.sin(dl), beta = grau(Math.asin(sb)), phi = 0, m = 0, Eb = 0, Ed = 0;
      if (beta > 0) {

        phi = grau(Math.atan2(y, x));   // Excel: ATAN2(x; y), ordem inversa da de Math.atan2(y, x)
        m = 1 / (sb + 0.50572 * Math.pow(6.07995 + beta, -1.6364));

  /* Irradiância incidente em cada orientação, W/m².
     cos θ = cos β·cos(φ − ψ)·sen Σ + sen β·cos Σ
     Etb = Eb·máx(0; cos θ)
     Y = máx(0,45; 0,55 + 0,437·cos θ + 0,313·cos²θ)
     Etdr = Ed·(Y·sen Σ + cos Σ) + (Eb·máx(0; sen β) + Ed)·ρg·(1 − cos Σ)/2 (difusa do céu + refletida pelo solo)
     Et = Etb + Etdr

     (Excel: ATAN2(cosθ; senβ), ordem inversa da de Math.atan2), com o sen β da coluna D de Solar. Cada mês usa p = { nDia, tauB, tauD } do mês. */

      for (var i = 0; i < 24; i++) {

        }

        var Y = Math.max(0.45, 0.55 + 0.437 * cs + 0.313 * cs * cs);
        dr = r.Ed[i] * (Y * Math.sin(S) + Math.cos(S)) + (r.Eb[i] * Math.max(0, r.senBeta[i]) + r.Ed[i]) * p.rhoG * (1 - Math.cos(S)) / 2;
        c.push(cs); tb.push(b); td.push(dr); tt.push(b + dr);
      }
      r.omega[o.nome] = om; r.cos[o.nome] = c; r.Etb[o.nome] = tb; r.Etdr[o.nome] = td; r.Et[o.nome] = tt;

  }

  H.motor.solar = { ORIENTACOES: ORIENTACOES, DIA_DO_ANO: DIA_DO_ANO, diaDoAno: diaDoAno, derivados: derivados, posicao: posicao, irradiancia: irradiancia };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/sol_ar.js ==== */
/* Temperatura sol-ar (ASHRAE Fundamentals 2021 cap. 18 eq. 29), hora a hora, para as 9 orientações e as 2 cores.
   Reproduz a planilha carga-termica-cltd v1.0.5. Sem DOM. */
(function (H) {
  'use strict';
  var CORES = ['Clara', 'Escura'];

  /* te = to + (α/h_o)·Et − ε·ΔR/h_o; aho = α/h_o (m²K/W); dR = ε·ΔR/h_o (K): dRHoriz na horizontal, dRVert nas demais.
     to: 24 temperaturas externas (°C); Et: objeto Et de H.motor.solar.irradiancia;
     c = { ahoClara, ahoEscura, dRHoriz, dRVert }. Retorno { "<orientação>|<cor>": [24] } */
  function temperaturas(to, Et, c) {
    var r = {};
    H.motor.solar.ORIENTACOES.forEach(function (o) {
      var dR = o.nome === 'Horizontal' ? c.dRHoriz : c.dRVert;
      CORES.forEach(function (cor) {
        var aho = cor === 'Clara' ? c.ahoClara : c.ahoEscura, s = [];
        for (var h = 0; h < 24; h++) s.push(to[h] + aho * Et[o.nome][h] - dR);
        r[o.nome + '|' + cor] = s;
      });
    });
    return r;
  }

  H.motor.solAr = { temperaturas: temperaturas };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/clima.js ==== */
/* Clima horário do dia de projeto (NBR 16401-1:2024 A.3 e Tabela A.8; psicrometria do ASHRAE Fundamentals 2021 cap. 1) e condições
   de projeto por mês (opção E). Reproduz as abas Clima_h, Tab_ClimaMes e Projeto (seção 6) da planilha carga-termica-cltd v1.0.5. Sem DOM. */
(function (H) {
  'use strict';
  var ps = H.motor.psicro;

  // Temperatura de ponto de orvalho (°C) a partir de pw (kPa): cap. 1 eq. (37), Peppers

  }

  // tbu (°C) que dá a umidade w na tbs e pressão p: bisseção de 40 voltas sobre a eq. (33), entre tpo e tbs
  function tbuDeW(tbs, w, tpo, p) {

      var m = (a0 + a1) / 2, wc = ps.wDeTbsTbu(tbs, m, p);
      if (wc > w) { a1 = m; } else { a0 = m; }
    }

  }

  /* Condições de projeto por mês, opção E (planilha v1.0.5, aba Tab_ClimaMes colunas S a AA; decisão do Francisco, 2026-10-06):
     o valor anual da NBR 16401-1:2024 (Tabelas A.4 e A.5) fica no mês do máximo de cada variável; os outros meses descem pela
     diferença mensal da ASHRAE Climatic Design Conditions 2021 (CONFERIR). freq: '0.4', '1' ou '2' → percentil mensal 2, 5 ou 10 %
     (colunas _2, _5, _10 de H.dados.motor.climaMensal); k = H.dados.motor.clima; tab = H.dados.motor.climaMensal (12 linhas).
     mDB = primeiro mês do máximo de DB; mWB = primeiro mês do máximo de WB. Para cada mês:
       tbsTbs = tbs_freq − (máx DB − DB);  tbuTbs = mín(tbsTbs; tbu_freq + MCWB − MCWB[mDB]);
       tbsTbu = tbs_coinc_freq + MCDB − MCDB[mWB];  tbuTbu = mín(tbsTbu; tbu_max_freq − (máx WB − WB));
       dT = variacao_diaria + MDBR − MDBR[mDB].
     Retorno { mDB, mWB, meses: [12 × { mes, tbsTbs, tbuTbs, tbsTbu, tbuTbu, dT, tauB, tauD }] } (mesmas contas, na mesma ordem, da planilha) */
  var SUFIXO = { '0.4': '2', '1': '5', '2': '10' };
  function mensal(freq, k, tab) {

    function v(chave) {

      return k[chave];
    }
    var db = tab.map(function (l) { return l['db_' + s]; }), mcwb = tab.map(function (l) { return l['mcwb_' + s]; });
    var wb = tab.map(function (l) { return l['wb_' + s]; }), mcdb = tab.map(function (l) { return l['mcdb_' + s]; });
    var maxDB = Math.max.apply(null, db), maxWB = Math.max.apply(null, wb), mDB = db.indexOf(maxDB), mWB = wb.indexOf(maxWB);

    else if (dia === 'tbu') r = mm ? { tbs: mm.tbsTbu, tbu: mm.tbuTbu, dTbs: mm.dT } : { tbs: v('tbs_coinc_' + freq), tbu: v('tbu_max_' + freq) };

  }

  /* Clima das 24 h. e = { tbs, tbu, dTbs, alt, f } (°C, °C, K, m, perfil da Tabela A.8).
     to = tbs − f·Δtbs; tpo constante, limitada à saturação (w = 0,621945·pws/(p − pws) quando tpo ≥ to).
     ho: eq. (30); vo: eq. (26); pwExt: eq. (20) invertida. Retorno { p, wExt, pwExt, tpoExt, to, wo, ho, vo } */

  }

})(window.HVAC);
</script>
<script>
/* ==== js/motor/rts.js ==== */
/* RTS (séries de tempo radiantes): converte um ganho de calor em carga de resfriamento (parcela convectiva imediata
   + parcela radiante atrasada pela série). Reproduz a conta de carga_cond de Amb_Modelo da planilha carga-termica-cltd v1.0.5. Sem DOM. */
(function (H) {
  'use strict';

  /* Chave da zona = construção|carpete|pctVidro% (cltd aba_ambiente.ps1, TEXT(B12,"0%")).
     z = { construcao, carpete, pctVidro } com pctVidro em fração */
  function chaveZona(z) {
    return z.construcao + '|' + z.carpete + '|' + Math.round(z.pctVidro * 100) + '%';
  }

  /* carga[i] = (1 − fRad)·q[i] + fRad·Σ n=0..23 de r[n]·q[(i − n) mod 24], W, 24 h
     (ASHRAE 2021 cap. 18, método RTS: parte convectiva imediata + parte radiante pela série; Eq. (33), p. 18.27).
     q em W, r = série RTS em fração, fRad = fração radiante */
  function aplicar(q, r, fRad) {
    var out = [];
    for (var i = 0; i < 24; i++) {
      var s = 0;
      for (var n = 0; n < 24; n++) s += r[n] * q[(((i - n) % 24) + 24) % 24];
      out.push((1 - fRad) * q[i] + fRad * s);
    }
    return out;
  }

})(window.HVAC);

</script>
<script>
/* ==== js/motor/conducao.js ==== */
/* Condução pelas paredes, coberturas e vidros: ganho instantâneo q_in e série de funções de transferência de condução (CTS),

<script>
/* ==== js/motor/vidros.js ==== */
/* Vidros: SHGC normal, IAC e fração radiante do sombreamento interno, SHGC por ângulo de incidência, ganho solar direto e difuso

   (aba_ambiente.ps1: colunas N, O, U, V, W, X, Y, Z dos elementos e linhas 266 a 269 do gerador). Sem DOM.
   Fontes: SHGC ASHRAE Fundamentals 2021 cap. 15 Tabela 10; IAC e FR por vidro e dispositivo cap. 15 Tabelas 14A, 14B e 14G (H.dados.motor.iacPor);
   forma IAC(θ, Ω) = IAC0 + (IAC60 − IAC0)·mín(Ω; 60°)/60° (decisão do Francisco, 2026-10-06; desvio declarado da Eq. (40) impressa (ASHRAE Fundamentals 2021 cap. 15, p. 15.35), que traz
   mín(1,2·Ω; 60°): reproduz o exemplo numérico do cap. 18, CONFERIR errata); séries RTS cap. 18 Tabelas 19 e 20. */

  'use strict';

  var SEM_SOMBREAMENTO = 'Sem sombreamento interno';
  // Textos do aviso (coluna Z da planilha), um por código

    fabricante: 'IAC e FR do fabricante',
    fabricanteSemFr: 'IAC do fabricante; FR não informada: adotada a fração radiante do vidro',
    semCredito: 'SEM CRÉDITO: não há IAC tabelado para este vidro com este dispositivo (ASHRAE Fundamentals 2021 cap. 15, Tabelas 14A, 14B e 14G, p. 15.39 a 15.41 e 15.50 a 15.52); informe IAC e FR do fabricante'
  };

     el = { tipo, composicao (vidro), sombreamento (dispositivo), iacFab, frFab (opcionais, vazio = não informado), shgc };

     - com iacFab: iac0 = iac60 = iacDif = iacFab; frSomb = frFab se houver, senão a fração radiante do vidro (SHGC > 0,5 → vidroAlto);

    }
    var v = dados.vidrosPor[el.composicao], t = v && !vazio(el.sombreamento) ? dados.iacPor[v.id + '|' + el.sombreamento] : null;

     el = { tipo, composicao, orientacao, area, iac0, iac60 }; sol = H.motor.solar.irradiancia (cos, Etb, omega por orientação);
     dados = { vidrosPor }. Não é vidro ou área 0: zeros. Vidro ou orientação não achados: erro (#N/D na planilha).
     fs (opcional, só no app web) = fração ensolarada do vidro nas 24 h (H.motor.sombraExterna.fracao: beiral e brise, cap. 15 Eq. (33) a (36)):

    if (el.tipo !== 'Vidro' || el.area === 0) return zeros();

     radiante do elemento (= frSomb). Sem frSomb: direta 100 % radiante pela série RTS solar (Tabela 20) + difusa pela série não solar
     (Tabela 19) com a fração radiante do vidro. dir e dif = ganhoDir e ganhoDif; el = { tipo, frSomb, fracRad }; r = { ns, sol } (frações). Não é vidro: zeros */

    coeficientes: coeficientes, shgcAngulo: shgcAngulo, ganhoDir: ganhoDir, ganhoDif: ganhoDif, cargaSolar: cargaSolar };
})(window.HVAC);
</script>
<script>
/* ==== js/motor/sombra_externa.js ==== */
/* Sombreamento externo do vidro por projeções (beiral, brise lateral e lâminas repetidas): fração ensolarada do vidro, hora a hora. Sem DOM.
   Só no app web: a planilha carga-termica-cltd v1.0.5 não tem esta parte (decisão do Francisco, 2026-10-08); sem proteção informada o motor segue
   pelo caminho que fecha com a planilha.
   Fonte: ASHRAE Fundamentals 2021 cap. 15, p. 15.34: Eq. (33) tg Ω = tg β / cos γ; Eq. (34) SW = PV·|tg γ|; Eq. (35) SH = PH·tg Ω;
   Eq. (36) ASL = [W − (SW − RW)]·[H − (SH − RH)]. Regra do app (leitura geométrica da Eq. (36)): cada fator fica entre 0 e a dimensão do vidro.

   Lâminas repetidas: a mesma conta, com o espaçamento no lugar da altura (ou da largura) do vidro e folga zero.
   Entradas da face (arquivo, formato 3; ausente = sem sombreamento externo):
     extH '' | 'beiral' | 'laminas'; extHProj, extHAlt (altura do vidro ou espaçamento), extHFolga (topo do vidro até o beiral), em m;
     extV '' | 'brise' | 'laminas'; extVProj, extVLarg (largura de cada janela ou espaçamento), extVFolga (borda do vidro até o brise), em m;
     extVLado 'ambos' | 'esq' | 'dir', olhando a fachada de fora (só no brise lateral; vazio = 'ambos'). */

  // Ponto cardeal à esquerda e à direita de quem olha a fachada de fora

  function rad(x) { return x * Math.PI / 180; }
  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }

  function num(x) {
    if (vazio(x)) return null;

    return n !== null && isFinite(n) ? n : null;

     { h, v, incompleto: ['h', 'v'…], ativa }: h = { tipo, proj, dim, folga } ou null; v = o mesmo, com lado; ativa = há sombra a calcular.

        if (p.v && (p.v.lado === 'ambos' || (p.v.lado === 'esq' ? sg > 0 : sg < 0))) {

    if (p.h) t.push(p.h.tipo === 'beiral' ? 'beiral de ' + m(p.h.proj) + ' (vidro de ' + m(p.h.dim) + ' de altura' + (p.h.folga > 0 ? ', folga de ' + m(p.h.folga) : '') + ')'
                                           : 'lâminas horizontais de ' + m(p.h.proj) + ' a cada ' + m(p.h.dim));
    if (p.v) t.push(p.v.tipo === 'brise' ? 'brise lateral de ' + m(p.v.proj) + (p.v.lado === 'ambos' ? ' dos dois lados' : ' só à ' + (p.v.lado === 'esq' ? 'esquerda' : 'direita') +
                                             (CARDEAL[face] ? ' (' + CARDEAL[face][p.v.lado] + ')' : '')) + ' (janelas de ' + m(p.v.dim) + ' de largura' + (p.v.folga > 0 ? ', folga de ' + m(p.v.folga) : '') + ')'
                                         : 'lâminas verticais de ' + m(p.v.proj) + ' a cada ' + m(p.v.dim));
    return t.join(' e ');
  }

  H.motor.sombraExterna = { TIPOS_H: TIPOS_H, TIPOS_V: TIPOS_V, LADOS: LADOS, CARDEAL: CARDEAL, protecao: protecao, fracao: fracao, descrever: descrever };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/internos.js ==== */
/* Ganhos internos: pessoas, iluminação e equipamentos (ganho e carga de resfriamento por RTS) e calor da iluminação ao retorno.
   Reproduz as linhas pessoas_sens_ganho, pessoas_sens_carga, pessoas_lat, ilum_ganho, ilum_carga, equip_ganho, equip_carga e
   ilum_retorno de Amb_Modelo da planilha carga-termica-cltd v1.0.5 (aba_ambiente.ps1, seções 3 e 7; B52 e coluna I das linhas 55 a 58;
   aba_tabelas.ps1, Tab_Internas). Sem DOM. Só resfriamento, Brasília.

   (C.3), coluna fator_diversidade de equipamentos.csv. O calor por pessoa continua o de 24 °C mesmo com outra temperatura no ambiente.

  /* Equipamentos: por linha w = wManual se ≠ vazio, senão pelo item (SEERRO → 0); G = qtd · w · fatorUso (fatorUso(e, dados));
     fr = fração radiante do item (SEERRO → equipSemVent). maxW = ΣG + adicional;
     fracRad = maxW > 0 ? (ΣG·fr + adicional · equipSemVent) / maxW : equipSemVent */
  function equipamentos(amb, dados) {
    var sv = dados.fracRad.equipSemVent, linhas = [], soma = 0, somaFr = 0;
    (amb.equip || []).forEach(function (e) {
      var t = tem(dados.equipamentosPor, e.item) ? dados.equipamentosPor[e.item] : null;
      var w = !vazio(e.wManual) ? e.wManual : (t ? t.w : 0);
      var fu = fatorUso(e, dados), g = e.qtd * w * fu;
      var fr = t ? t.fracaoRadiante : sv;
      linhas.push({ item: e.item, w: w, fu: fu, G: g, fr: fr });
      soma += g;
      somaFr += g * fr;

    return { maxW: maxW, fracRad: maxW > 0 ? (somaFr + adic * sv) / maxW : sv, linhas: linhas };

  function escala(k, perf) {
    var o = [];
    for (var h = 0; h < 24; h++) o.push(k * perf[h]);
    return o;
  }

  /* Ganhos horários (W, 24 h): pessoasSensGanho, pessoasLat, ilumGanho, equipGanho e ilumRetorno (calor da iluminação ao retorno, sem RTS).
     Não dependem do dia de projeto */
  function ganhos(amb, dados) {

    var p = pessoas(amb, dados), il = iluminacao(amb, dados), eq = equipamentos(amb, dados);

      pessoasLat: escala(amb.pessoas * p.latPessoa, perf),
      ilumGanho: escala(il.maxW, perf),

  /* Cargas: os ganhos (quatro + ilumRetorno) + pessoasSensCarga, ilumCarga e equipCarga (RTS não solar rNs com a fração radiante de cada um).

    c.pessoasSensCarga = H.motor.rts.aplicar(c.pessoasSensGanho, rNs, dados.fracRad.pessoas);
    c.ilumCarga = H.motor.rts.aplicar(c.ilumGanho, rNs, il.fracRad);
    c.equipCarga = H.motor.rts.aplicar(c.equipGanho, rNs, eq.fracRad);

  }

  /* As quatro linhas do perfil de ambiente (planilha linhas 87-90) */
  function linhasPerfil(c) {
    return { pessoasSens: c.pessoasSensCarga, pessoasLat: c.pessoasLat, iluminacao: c.ilumCarga, equipamentos: c.equipCarga };
  }

  H.motor.internos = { RETORNO_PLENUM: RETORNO_PLENUM, RETORNO_DUTADO: RETORNO_DUTADO, fatorUso: fatorUso, perfil: perfil, pessoas: pessoas, iluminacao: iluminacao, equipamentos: equipamentos,
    ganhos: ganhos, cargas: cargas, linhasPerfil: linhasPerfil };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/ar_exterior.js ==== */
/* Ar exterior e infiltração: fatores Fp e Fa, vazões e cargas sensível e latente horárias (24 h).
   Reproduz as linhas ae_sens, ae_lat, inf_sens e inf_lat de Amb_Modelo da planilha carga-termica-cltd v1.0.5
   (aba_ambiente.ps1: B6, B8, B9, B14, B64-B79; fórmulas horárias nas linhas 286-289) e o Ev do sistema (aba Resumo, bloco E). Sem DOM.
   Só resfriamento, Brasília. v1.0.5: T e w internos são os do ambiente (Amb_Modelo I7 e I9); a infiltração usa o ar padrão (1,2 kg/m³),
   mesma forma e mesma convenção do ar exterior (sem o volume específico local); decisão do Francisco, 2026-10-06.
   Fontes: NBR 16401-3:2024 Tabela 1 (Fp, Fa); 5.3.1: Qef1 = Pz·Fp·D (Eq. 1), Qef2 = Az·Fa (Eq. 2) e Qef = a maior entre
   Qef1 e Qef2; 5.3.2: Qz = Qef ÷ Ez (Eq. 3). D = fator de diversidade de ocupação (5.5.7, Eq. 6); Ez da Tabela 3.
   Premissas declaradas: D = 1 por padrão (recinto isolado; a norma só dá valor no exemplo do Anexo D, 0,8); Ez = 1,0 por
   padrão (insuflação de ar frio pelo forro); a carga térmica do ar exterior usa Qz, o ar efetivamente admitido (a norma não
   diz qual vazão usar: interpretação); vazão em ar padrão de 1,2 kg/m³, sem redução pela altitude (Tabela 1, Nota 1;
   decisão do Francisco, 2026-10-02). Infiltração também em ar padrão (v1.0.5; a norma não trata da infiltração); ASHRAE
   Fundamentals 2021 cap. 1 Eq. (30), p. 1.10 (psicrometria; h = 1,006·t + W·(2501 + 1,86·t)). Substitui a soma V_ef = Pz·Fp + A·Fa (edição de 2008 / ASHRAE 62.1). Sem perfil de ocupação
   e sem máx(0; …): o sinal é o real; o latente líquido é assunto das linhas de total. */
(function (H) {
  'use strict';

  var CP_AR = 1.006, CP_V = 1.86, H_FG = 2501;   // kJ/kg·K, kJ/kg·K, kJ/kg (planilha: cp_ar, cp_v, h_fg); ASHRAE Fundamentals 2021 cap. 1 Eq. (30), p. 1.10 (h = 1,006·t + W·(2501 + 1,86·t))

  function vazio(x) { return x === null || x === undefined || x === ''; }
  function tem(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }   // nomes como constructor ou toString não são da tabela

  /* Fp (L/s por pessoa) e Fa (L/s por m²): coluna de 700 ppm se co2ppm = 700, senão a de 500 (SEERRO → 0);
     adotado = manual se ≠ vazio (zero digitado vale), senão da tabela (planilha B64-B69) */
  function fatores(amb, dados) {
    var r = tem(dados.recintosPor, amb.recinto) ? dados.recintosPor[amb.recinto] : null;
    var fpTab = r ? (amb.co2ppm === 700 ? r.fp700 : r.fp500) : 0, faTab = r ? r.fa : 0;
    return { fpTab: fpTab, faTab: faTab, fp: !vazio(amb.fpManual) ? amb.fpManual : fpTab, fa: !vazio(amb.faManual) ? amb.faManual : faTab };
  }

  /* Vazões (L/s): pz = amb.pz se ≠ vazio, senão amb.pessoas (planilha B70 = B44); d = amb.d (vazio → 1; B71); ez = amb.ez
     (vazio → 1; B75); qef1 = pz·fp·d (B72, nesta ordem); qef2 = área·fa (B73); qef = máx(qef1; qef2) (B74);
     arExtLs = qef/ez (B76, Qz); volume = área · peDireito; infLs = infRenH · volume / 3,6 (nesta ordem) */
  function vazoes(amb, dados) {
    var ft = fatores(amb, dados), pz = !vazio(amb.pz) ? amb.pz : amb.pessoas;
    var d = !vazio(amb.d) ? amb.d : 1, ez = !vazio(amb.ez) ? amb.ez : 1;
    // Ez ≤ 0 ou não finito → 1 (a planilha mostra #DIV/0! nesse caso); D < 0 ou não finito → 1

    if (!isFinite(d) || d < 0) d = 1;
    var volume = amb.area * amb.peDireito;
    var qef1 = pz * ft.fp * d, qef2 = amb.area * ft.fa, qef = Math.max(qef1, qef2);
    return { fp: ft.fp, fa: ft.fa, pz: pz, d: d, ez: ez, qef1: qef1, qef2: qef2, qef: qef, arExtLs: qef / ez,
      volume: volume, infLs: amb.infRenH * volume / 3.6 };
  }

  /* Cargas horárias (W, 24 h). clima = { to, wo } (°C, kg/kg; vo não é mais usado); k = { tInt, wInt } do ambiente (°C, kg/kg).
     Ar exterior e infiltração com ρ padrão (mesma ordem de operações da planilha) */
  function cargas(amb, dados, clima, k) {
    var v = vazoes(amb, dados), rho = H.motor.psicro.RHO_PADRAO;
    var aeSens = [], aeLat = [], infSens = [], infLat = [];
    for (var h = 0; h < 24; h++) {
      var to = clima.to[h], wo = clima.wo[h];
      aeSens.push((v.arExtLs / 1000) * rho * (CP_AR + CP_V * wo) * (to - k.tInt) * 1000);
      aeLat.push((v.arExtLs / 1000) * rho * H_FG * (wo - k.wInt) * 1000);
      infSens.push((v.infLs / 1000) * rho * (CP_AR + CP_V * wo) * (to - k.tInt) * 1000);
      infLat.push((v.infLs / 1000) * rho * H_FG * (wo - k.wInt) * 1000);
    }
    return { aeSens: aeSens, aeLat: aeLat, infSens: infSens, infLat: infLat };
  }

  /* Umidade absoluta interna (planilha: pw_int = UR_int/100 · pws_int; w_int = 0,621945 · pw_int / (P_atm − pw_int)) */
  function wInterna(tInt, urPct, p) {
    var ps = H.motor.psicro;
    return ps.wDePw(urPct / 100 * ps.pws(tInt), p);
  }

  /* Eficiência do sistema de ventilação Ev (planilha Resumo, Sis_Ev; NBR 16401-3:2024 5.5.9, Eq. (7) e (8)): tipo = "Zonas múltiplas com
     recirculação" → (D vazio ou D ≥ 0,60 ? 0,75 : 0,88·D + 0,22); outros tipos (zona única, 100 % de ar exterior) → 1 (não há divisão por Ev).
     D que não é número finito entre 0 e 1 (texto, NaN, negativo, > 1) vale como vazio (Ev = 0,75), como o D do ambiente (inválido → padrão). */

    var valido = typeof d === 'number' && isFinite(d) && d >= 0 && d <= 1;

  }

  /* As quatro linhas do perfil de ambiente (planilha linhas 96-99) */
  function linhasPerfil(c) {
    return { arExtSens: c.aeSens, arExtLat: c.aeLat, infSens: c.infSens, infLat: c.infLat };
  }

  H.motor.arExterior = { CP_AR: CP_AR, CP_V: CP_V, H_FG: H_FG, fatores: fatores, vazoes: vazoes, cargas: cargas,
    wInterna: wInterna, SIS_RECIRC: SIS_RECIRC, ev: ev, linhasPerfil: linhasPerfil };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/totais.js ==== */
/* Totais do ambiente: soma das parcelas horárias, latente líquido, hora de pico, capacidade e segunda maior hora (24 h).
   Reproduz as linhas de Amb_Modelo da planilha carga-termica-cltd v1.0.5 (aba_ambiente.ps1, seção 5 "Perfil horário":
   opaca, vidro condução e vidro solar = SUMIFS da área de motor; seção 6, B103 a B106; seção 8, linhas 259 a 270). Sem DOM.
   Só resfriamento, Brasília.
   Regras (decisão do Francisco, 2026-10-02): total = sensível + máx(0; latente bruto); o latente negativo (ar exterior mais
   seco que o ambiente) nunca abate o sensível.
   Hora de pico (v1.0.5, B103): o maior total entre as horas da janela de ocupação (H_ini ≤ h ≤ H_fim), mesmo que seja ≤ 0, primeira
   ocorrência; sem hora na janela (ou sem ocorrência), o primeiro máximo das 24 h (planilha: LET(m; MAXIFS(t; j; 1); SEERRO(CORRESP(1; (t = m)·(j = 1); 0);
   CORRESP(MÁXIMO(t); t; 0)))). Capacidade (seção 8, NBR 16401-1:2024 6.2.2.2) = total + calor da iluminação ao retorno, com a mesma regra
   de hora; segunda maior hora = primeiro máximo do total entre as horas da janela diferentes da hora de pico (vazio com menos de 2 horas
   na janela). Horas de 1 a 24. */
(function (H) {
  'use strict';

  /* Linhas de total (W, 24 h) a partir das linhas do perfil. p = { opaca, vidroCond, vidroSolar, pessoasSens, pessoasLat,
     iluminacao, equipamentos, arExtSens, arExtLat, infSens, infLat }. Somas na ordem da planilha:
     totalSens = opaca + vidroCond + vidroSolar + pessoasSens + iluminacao + equipamentos + arExtSens + infSens;
     totalLat = pessoasLat + arExtLat + infLat; total = totalSens + máx(0; totalLat) */
  function linhas(p) {
    var totalSens = [], totalLat = [], total = [];
    for (var h = 0; h < 24; h++) {
      var s = p.opaca[h] + p.vidroCond[h] + p.vidroSolar[h] + p.pessoasSens[h] + p.iluminacao[h] + p.equipamentos[h] + p.arExtSens[h] + p.infSens[h];
      var l = p.pessoasLat[h] + p.arExtLat[h] + p.infLat[h];
      totalSens.push(s); totalLat.push(l); total.push(s + Math.max(0, l));
    }
    return { totalSens: totalSens, totalLat: totalLat, total: total };
  }

  /* Calor sensível do ambiente (W, 24 h), v0.5.1 (decisão do Francisco, 2026-10-08): as linhas sensíveis do perfil sem o ar exterior.
     sensAmb = opaca + vidroCond + vidroSolar + pessoasSens + iluminacao + equipamentos + infSens (a infiltração sensível entra direto no ambiente).
     Fora: arExtSens, todo o latente e o calor da iluminação ao retorno. É o totalSens de linhas(p) sem a parcela arExtSens, somado na mesma ordem
     (soma direta, não totalSens − arExtSens). É o número que dimensiona a vazão de insuflamento do ambiente. */
  function sensivelAmbiente(p) {
    var s = [];
    for (var h = 0; h < 24; h++) s.push(p.opaca[h] + p.vidroCond[h] + p.vidroSolar[h] + p.pessoasSens[h] + p.iluminacao[h] + p.equipamentos[h] + p.infSens[h]);
    return s;
  }

  // Hora (1 a 24) do primeiro máximo da série entre as horas da janela hIni..hFim; sem hora na janela: primeiro máximo das 24 h
  function horaDoMaximo(serie, hIni, hFim) {
    var h0 = 0, i;
    for (i = 1; i <= 24; i++) if (i >= hIni && i <= hFim && (h0 === 0 || serie[i - 1] > serie[h0 - 1])) h0 = i;
    if (h0 > 0) return h0;
    h0 = 1;
    for (i = 2; i <= 24; i++) if (serie[i - 1] > serie[h0 - 1]) h0 = i;
    return h0;
  }

  /* Pico: t = { totalSens, totalLat, total } (saída de linhas); hIni e hFim = janela de ocupação (H_ini e H_fim, inclusive).
     Devolve { horaPico (1 a 24), sensivelPico, latentePico (bruto), totalPico } */
  function pico(t, hIni, hFim) {
    var h = horaDoMaximo(t.total, hIni, hFim), iMax = h - 1;
    return { horaPico: h, sensivelPico: t.totalSens[iMax], latentePico: t.totalLat[iMax], totalPico: t.total[iMax] };
  }

  /* Capacidade do sistema para o ambiente (seção 8): capacidade[h] = total[h] + ilumRetorno[h]; horaCap pela regra do pico sobre a capacidade;
     retPico e capPico nessa hora. total e ilumRetorno: 24 valores (W). Devolve { capacidade, horaCap, retPico, capPico } */
  function capacidade(total, ilumRetorno, hIni, hFim) {
    var cap = [], h;
    for (h = 0; h < 24; h++) cap.push(total[h] + ilumRetorno[h]);
    var hc = horaDoMaximo(cap, hIni, hFim);
    return { capacidade: cap, horaCap: hc, retPico: ilumRetorno[hc - 1], capPico: cap[hc - 1] };
  }

  /* Segunda maior hora da carga do ambiente (seção 8, B269 e B270): com menos de 2 horas na janela, { hora2: null, total2: null }; senão o
     primeiro máximo do total entre as horas da janela diferentes de horaPico. */
  function segundaHora(total, horaPico, hIni, hFim) {
    var n = 0, h2 = 0, i;
    for (i = 1; i <= 24; i++) {
      if (i < hIni || i > hFim) continue;
      n++;
      if (i !== horaPico && (h2 === 0 || total[i - 1] > total[h2 - 1])) h2 = i;
    }
    if (n < 2 || h2 === 0) return { hora2: null, total2: null };
    return { hora2: h2, total2: total[h2 - 1] };
  }

  /* Linhas de envoltória a partir das séries por elemento (mesma ordem de elementos nas três listas):
     opaca = Σ carga_cond dos elementos de tipo ≠ "Vidro"; vidroCond = Σ carga_cond dos de tipo "Vidro";
     vidroSolar = Σ carga_solar de todos. elementos[i] = { tipo }; cargasCond[i] e cargasSolar[i] = 24 valores (W).
     cargasCond vem de H.motor.conducao.carga e cargasSolar de H.motor.vidros.cargaSolar (nesta ordem de soma) */
  function envoltoria(elementos, cargasCond, cargasSolar) {
    var opaca = [], vidroCond = [], vidroSolar = [];
    for (var h = 0; h < 24; h++) {
      var op = 0, vc = 0, vs = 0;
      elementos.forEach(function (el, i) {
        if (el.tipo === 'Vidro') vc += cargasCond[i][h]; else op += cargasCond[i][h];
        vs += cargasSolar[i][h];
      });
      opaca.push(op); vidroCond.push(vc); vidroSolar.push(vs);
    }
    return { opaca: opaca, vidroCond: vidroCond, vidroSolar: vidroSolar };
  }

  H.motor.totais = { linhas: linhas, sensivelAmbiente: sensivelAmbiente, horaDoMaximo: horaDoMaximo, pico: pico, capacidade: capacidade, segundaHora: segundaHora, envoltoria: envoltoria };
})(window.HVAC);

</script>
<script>
/* ==== js/motor/carga.js ==== */
/* Motor do app v0.5 (sem DOM): fachada sobre os módulos do método CTS/RTS (ASHRAE Fundamentals 2021 cap. 18), com dados da
   NBR 16401:2024. Conferido contra a planilha Carga_Termica_Brasilia v1.0.5 (o gabarito_motor.js só serve à página de testes; o app calcula pelo motor).
   Ordem das operações:
   - contexto(projeto, mes): irradiância solar do mês (dia 21, τb e τd do mês), pressão e, para cada dia de projeto (tbs máxima, tbu
     máxima e umidade máxima), clima horário e temperaturas sol-ar; condições de projeto por mês pela opção E (clima.js);
   - envoltoria(amb): elementos (parede, vidro, porta, cobertura, divisória) com U, série CTS, chave sol-ar, SHGC, IAC0/IAC60/IACdif, FR e aviso;
   - calcularDia: condução (q_in → CTS → RTS), solar dos vidros (direta e difusa, RTS), ganhos internos (RTS), ar exterior e infiltração
     (ar padrão), linhas de total (latente líquido = máx(0; latente bruto)), hora de pico (janela de ocupação, maior total mesmo que ≤ 0),
     calor da iluminação ao retorno, capacidade (carga do ambiente + retorno) e segunda maior hora;
   - calcular: varre os 12 meses × 3 dias e adota a combinação de maior capacidade (planilha: aba Varredura e Resumo, bloco D); a umidade
     máxima só conta com controle de umidade (NBR 16401-1:2024 5.1.1.2);
   - conjunto: mesmo mês e dia para todos os ambientes; carga simultânea, sistema de ar (Ev, acréscimo de ar exterior, capacidade do
     sistema; aba Resumo, bloco E) e adoção pelo máximo da capacidade do sistema.
   Ar exterior e infiltração em ar padrão (1,2 kg/m³). Só resfriamento, Brasília.
   Nenhuma função altera o objeto recebido: campos ausentes ou vazios assumem o padrão.
   Entradas da v0.5.0 (a tela só chega na sessão 4; ausente = padrão): projeto.sistema, projeto.dSistema, projeto.tInt, projeto.urInt,
   amb.tInt, amb.urInt, amb.ilum.retorno, amb.faces.X.somb (nome da lista), amb.faces.X.sombIac, amb.faces.X.sombFr, amb.equip[].fu (null = diversidade da norma). */
(function (H) {
  'use strict';
  var tab = H.dados.tab, dm = H.dados.motor, M = H.motor;
  var DIAS = ['tbs', 'tbu', 'umi'];
  var NOME_DIA = { tbs: 'tbs máxima', tbu: 'tbu máxima', umi: 'umidade máxima' };
  var FACES = { N: 'Norte', L: 'Leste', S: 'Sul', O: 'Oeste', C: 'Cobertura', P: 'Piso' };
  var ORIENTACAO = { N: 'Norte', L: 'Leste', S: 'Sul', O: 'Oeste', C: 'Horizontal', P: 'Horizontal' };
  var SISTEMA_PADRAO = 'Zona única (Qs = Qz)';
  var PAD = { freq: '0.4', construcao: 'Média', carpete: 'Sem carpete', pctVidro: 0.5, perfil: 'Escritório 8h-18h',
    luminaria: 'LED troffer embutido, difusor uniforme', vidroTipo: 'Vidro simples incolor 6 mm',
    portaComp: 'Porta externa de madeira 40 mm', portaCor: 'Escura' };
  var SOMB_FABRICANTE = 'Outro (IAC e FR do fabricante)';
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }
  /* Número digitado: número, ou texto com vírgula ou ponto decimal ("0,5"); vazio → null; texto que não é número → NaN (inválido) */
  function numeroFlex(x) {

  }

  // Pertença própria à tabela (nomes como constructor ou toString não contam)
  function tem(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function ou(v, padrao) { return v === null || v === undefined ? padrao : v; }

  function padroes(amb) {

    var d = tem(tab.iluminacaoPor, amb.ilum.tipo) ? tab.iluminacaoPor[amb.ilum.tipo] : {};
    var p = {};

                       f.num(it.U, 2) + ' W/(m²·°C) × ' + f.num(it.area, 1) + ' m² × ' + f.num(x.cltdEq, 2) + ' °C', W(x.conducao),
                       (it.composicao ? it.composicao + '. ' : '') + origemU + '. Ganho q_in = U·A·(T_ref − t_int); ' + solAr +
                       (vidro ? '' : '. Série CTS ' + it.ctsId + (cts ? ' (' + cts.fonte + ')' : '')) +
                       '. ' + FR14 + ' = ' + f.num(it.fracRad, 2) + '. CLTD_eq = carga de condução do elemento ÷ (U·A) (RTS não solar ' + res.zonaChave + ')'));
        }

          var iacb = cosT > 0 ? it.iac0 + (it.iac60 - it.iac0) * Math.min(om, 60) / 60 : it.iac0;
          var shgcT = H.motor.vidros.shgcAngulo(cosT, vd.shgc);

          var sx = res.elem[ie].sombraExt, pe = it.ext, txSx = '';
          if (sx) {

            txSx = !sx.bate[ip] ? '; sem Sol direto nesta face nesta hora' :
              '; sombra externa: ' + (pe.h ? 'SH = ' + f.num(pe.h.proj, 2) + ' m × tg ' + f.num(om, 1) + '° = ' + f.num(sx.sh[ip], 2) + ' m' : '') + (pe.h && pe.v ? '; ' : '') +
              (pe.v ? 'SW = ' + f.num(pe.v.proj, 2) + ' m × |tg ' + f.num(sx.gama[ip], 1) + '°| = ' + f.num(sx.sw[ip], 2) + ' m' : '') +
              '; Fs = ' + (pe.h && pe.v ? f.num(sx.fv[ip], 3) + ' × ' + f.num(sx.fh[ip], 3) + ' = ' : '') + f.num(sx.fs[ip], 3);

                       'direto: ' + f.num(it.area, 1) + ' m² × ' + f.num(iacb, 3) + ' × ' + f.num(etb, 1) + ' W/m² × ' + f.num(shgcT, 3) + (sx ? ' × ' + f.num(sx.fs[ip], 3) : '') + ' = ' + W(dirC, 1) + ' (cos θ = ' + f.num(cosT, 3) + '; Ω = ' + f.num(om, 1) + '°' + txSx + '); ' +
                       'difuso: ' + f.num(it.area, 1) + ' m² × ' + f.num(it.iacDif, 2) + ' × ' + f.num(etd, 1) + ' W/m² × ' + f.num(vd.shgcDifuso, 3) + ' = ' + W(difC, 1) +
                       '; ganho solar = ' + W(dirC + difC, 1) + '; carga na hora (RTS) = ' + W(x.solar, 1),
                       W(x.solar),
                       'SHGC normal ' + f.num(it.shgc, 2) + ' (ASHRAE Fundamentals 2021 cap. 15 Tabela 10, p. 15.22 a 15.29); IAC0 ' + f.num(it.iac0, 2) + ' / IAC60 ' + f.num(it.iac60, 2) + ' / IACdif ' + f.num(it.iacDif, 2) + ' (' + (it.sombreamento || 'sem sombreamento') + '; ' + fonteIac(it) + '). ' +
                       'Método: ASHRAE Fundamentals 2021 cap. 18. ' + DESVIO_IAC + '. Série: ' +
                       (comFr ? (it.aviso === 'fabricanteSemFr' ? 'com a FR do vidro ' + f.num(it.frSomb, 2) + ' (fabricante sem FR; ' + FR_VIDRO + ')' : it.aviso === 'fabricante' ? 'com FR ' + f.num(it.frSomb, 2) + ' (informada pelo projetista)' : 'com FR ' + f.num(it.frSomb, 2) + ' (ASHRAE Fundamentals 2021 cap. 15 Tabelas 14A, 14B e 14G)') + ': direta + difusa pela ' + SERIE_NS + ' ' + res.zonaChave
                              : 'sem FR: direta 100 % radiante pela ' + SERIE_SOL + ' ' + res.zonaChave + '; difusa pela série não solar com a fração radiante do vidro (' + f.num(it.fracRad, 2) + '; ' + FR_VIDRO + ')') + (comFr ? '. ' + SOMB_PICO : '') +
                       (sx ? '. Sombreamento externo: ' + H.motor.sombraExterna.descrever(pe, it.face) + '. ' + SOMB_EXT : '') +

                   'Ar exterior mais seco que o ambiente pode compensar a umidade das pessoas, mas não abate calor sensível: o latente do ambiente não fica abaixo de zero'));
      lista.push(p('Carga do ambiente às ' + hp + ' h', 'sensível + latente líquido', W(res.sensPico) + ' + ' + W(res.latPico), W(res.totalPico),
                   'Dia de ' + res.nomeDia + ' (' + f.num(res.tbs, 1) + ' / ' + f.num(res.tbu, 1) + ' °C). Hora de pico: maior total entre ' + projeto.hIni + ' h e ' + projeto.hFim + ' h'));

                   'Capacidade de cada ambiente = carga do ambiente + calor da iluminação ao retorno, na hora do pico do sistema. ' + PLANILHA + ' (aba Resumo, bloco E)', { id: 'capSistema', num: pS.capSistemaW }));

        lista.push(p('Combinação adotada', 'maior capacidade (carga do ambiente + calor ao retorno) entre 12 meses × ' + H.motor.diasConsiderados(projeto).length + ' dias de projeto',
                     nomeComb + ', dia de ' + ra.nomeDia + ', ' + ra.hora + ' h', W(ra.capW), FONTE_5_1_1_2, { id: 'adotada', num: ra.capW }));
        lista.push(p('Maior carga do ambiente no ano', 'máx da carga do ambiente entre as combinações que contam',
                     H.motor.MESES[ra.mesCarga - 1] + ', dia de ' + (H.motor.DIAS.indexOf(ra.diaCarga) >= 0 ? res.meses[ra.mesCarga][ra.diaCarga].nomeDia : ra.diaCarga) + ', ' + ra.horaCarga + ' h', W(ra.cargaW),
                     'Informativo: a capacidade é dimensionada pela combinação adotada; esta é a maior carga do próprio ambiente (planilha v1.0.5, Resumo, bloco F)', { id: 'maiorCarga', num: ra.cargaW }));
        lista.push(p('Carga do ambiente às ' + ra.hora + ' h', 'sensível + latente líquido (passos da carga total)', '', W(cargaH), 'Combinação adotada', { id: 'cargaAmb', num: cargaH }));
        lista.push(p('+ Calor da iluminação ao retorno', 'q_ret(h) = P × (1 − fração no espaço) × perfil(h)', '', W(retH), FONTE_RETORNO, { id: 'retorno', num: retH }));
        lista.push(p('= Capacidade do ambiente', 'carga do ambiente + calor ao retorno', W(cargaH, 1) + ' + ' + W(retH, 1), W(ra.capW),
                     'A capacidade do sistema inclui também o acréscimo de ar exterior por Ev (só no conjunto)', { id: 'capAmbiente', num: ra.capW }));
        lista.push(p('Capacidade de projeto', 'Q = capacidade × (1 + FS)', W(ra.capW, 1) + ' × (1 + ' + numMin(projeto.fs / 100, 2, 4) + ')', W(ra.capProjetoW),
                     'Fator de segurança: critério do projetista; a ABNT NBR 16401-1:2024 7.1.1 (PDF p. 27) pede evitar fator de segurança arbitrário', { id: 'capProjeto', num: ra.capProjetoW }));

        lista.push(p('+ Calor da iluminação ao retorno', 'Σ q_ret(h)', '', W(pt.retornoHora), FONTE_RETORNO, { id: 'retorno', num: pt.retornoHora }));
        passosSistema(res, projeto).forEach(function (x) { lista.push(x); });
        lista.push(p('= Capacidade do sistema', 'carga do ambiente + retorno + acréscimo', W(pt.cargaAmbHora, 1) + ' + ' + W(pt.retornoHora, 1) + ' + ' + W(pt.acrescimo, 1), W(rs.capSistemaW),
                     PLANILHA + ' (aba Resumo, bloco D e E)', { id: 'capSistema', num: rs.capSistemaW }));
        lista.push(p('Capacidade de projeto', 'Q = capacidade do sistema × (1 + FS)', W(rs.capSistemaW, 1) + ' × (1 + ' + numMin(projeto.fs / 100, 2, 4) + ')', W(rs.capProjetoW),
                     'Fator de segurança: critério do projetista; a ABNT NBR 16401-1:2024 7.1.1 (PDF p. 27) pede evitar fator de segurança arbitrário', { id: 'capProjeto', num: rs.capProjetoW }));
        lista.push(p('Em toneladas de refrigeração', 'TR = Q / 3.516,85', W(rs.capProjetoW, 1) + ' / 3.516,85 W/TR', f.num(rs.capTR, 3) + ' TR', '1 TR = 12.000 BTU/h = 3.516,85 W', { id: 'tr', num: rs.capTR }));
        lista.push(p('Densidade de carga', 'Q / A', W(rs.capProjetoW, 1) + ' / ' + f.num(res.area, 1) + ' m²', f.num(rs.wm2, 1) + ' W/m²', '', { id: 'wm2', num: rs.wm2 }));
        if (rs.segunda) lista.push(p('Segunda maior hora da capacidade', 'maior valor da janela, depois do pico', rs.segunda.hora + ' h', W(rs.segunda.capW) + ' (' + W(rs.segunda.difW) + ' abaixo do pico)',
                                     'Mesma combinação adotada', { id: 'segunda', num: rs.segunda.capW }));

  }

  passos.SOMB_EXT = SOMB_EXT; passos.evTxt = evTxt; passos.textoQt = textoQt; passos.FONTE_EV = FONTE_EV; passos.FONTE_TIPOS = FONTE_TIPOS; passos.FONTE_D = FONTE_D; passos.FONTE_QS = FONTE_QS;

<script>
/* ==== js/motor/avisos.js ==== */
/* Avisos do cálculo (sem DOM): M.avisos(E, cj, opc) → lista de { nivel, codigo, texto, rota }.
   E = projeto { projeto, ambientes }; cj = M.conjunto(E); opc (opcional) = { importacao: N }, com N = nº de campos do arquivo substituídos
   na importação (a tela passa esse número; o núcleo não conhece o estado da tela). nivel: 'aviso' (pede atenção) ou 'info'.
   rota: hash da tela onde o assunto se resolve ('#/projeto', '#/ambiente/0?bloco=env&face=N'…).
   Códigos: dSistema, dAmbiente, ezAmbiente, semCredito, fabricanteSemFr, iacInvalido, frInvalido, retornoInvalido, mesFragil, dadosMensais, importacao,
   zonaUnicaVariosAmbientes, capacidadeNula, picoForaDaJanela, itemForaDaTabela, sombSobePico (info: o pico solar do vidro com dispositivo fica acima do pico sem dispositivo),
   sombExtIncompleto (beiral ou brise escolhido sem medidas: sem crédito), sombExterno (info: vidro com sombreamento externo, parte que a planilha não tem),
   sensForaDaJanela (info: o maior calor sensível do ambiente das 24 h fica fora da janela de ocupação).
   Os avisos de face que já existem (M.envoltoria().avisos: face sem composição, piso externo…) continuam em Resultados e no memorial como estão. */
(function (H) {
  'use strict';
  var M = H.motor, f = H.util.fmt;
  var NOME_FACE = { N: 'Norte', L: 'Leste', S: 'Sul', O: 'Oeste' };
  var SEM_DISP = 'Sem sombreamento interno', ZONA_UNICA = 'Zona única (Qs = Qz)';

  function tem(o, k) { return Object.prototype.hasOwnProperty.call(o, k); }
  function mx(v) { var m = -Infinity; for (var i = 0; i < v.length; i++) if (v[i] > m) m = v[i]; return m; }
  function soma(v) { var s = 0; for (var i = 0; i < v.length; i++) s += v[i]; return s; }

  /* Vidro com dispositivo de sombreamento: pico da carga solar com e sem o dispositivo na combinação x (um elemento de cj.ambientes[i].meses[mes][dia]),
     pelas mesmas funções do motor (M.contexto, M.vidros.ganhoDir, ganhoDif, cargaSolar; a carga solar não depende do dia de projeto).
     Devolve null (não é vidro com dispositivo) ou { dispositivo, comW, semW, pct (percentual acima do pico sem dispositivo; ≤ 0 se não sobe), sobe, somaCom, somaSem }.
     x = combinação; ie = índice do item em x.env.itens; projeto = projeto.projeto */
  function sombPico(x, ie, projeto) {
    var el = x.env.itens[ie], dm = H.dados.motor;
    if (!el || el.tipo !== 'Vidro' || !(el.area > 0)) return null;
    var temIacFab = el.iacFab !== null && el.iacFab !== undefined;
    if (!temIacFab && (vazio(el.sombreamento) || el.sombreamento === SEM_DISP)) return null;
    var sol = M.contexto(projeto, x.mes).sol, dv = { vidrosPor: dm.vidrosPor }, r = { ns: dm.rtsNs[x.zonaChave], sol: dm.rtsSol[x.zonaChave] };
    var el0 = {}, k;
    for (k in el) if (tem(el, k)) el0[k] = el[k];
    el0.iac0 = 1; el0.iac60 = 1; el0.iacDif = 1; el0.frSomb = null; el0.fracRad = M.conducao.fracRad(el0, dm.fracRad);
    var sx = x.elem[ie].sombraExt;   // com beiral ou brise, a comparação mantém a mesma sombra externa nos dois lados
    var com = x.elem[ie].solar, sem = M.vidros.cargaSolar(M.vidros.ganhoDir(el0, sol, dv, sx ? sx.fs : null), M.vidros.ganhoDif(el0, sol, dv), el0, r);
    var cw = mx(com), sw = mx(sem);
    return { dispositivo: temIacFab ? 'IAC e FR do fabricante' : el.sombreamento, comW: cw, semW: sw, pct: sw > 0 ? (cw / sw - 1) * 100 : 0,
      sobe: sw > 0 && cw > sw * (1 + 1e-9), somaCom: soma(com), somaSem: soma(sem) };
  }
  function textoSombPico(onde, s) {
    return onde + ': com ' + s.dispositivo + ' o pico da carga solar do vidro fica ' + f.num(s.pct, 1) + ' % acima do pico sem sombreamento (' + f.num(s.comW, 0) + ' W contra ' + f.num(s.semW, 0) +
      ' W)' + (s.somaCom <= s.somaSem ? ', embora a energia do dia seja menor' : '') + '. É efeito do método (ASHRAE Fundamentals 2021 cap. 18): com o dispositivo, parte do ganho passa a ser convectiva e vira carga na hora; ' +
      'sem ele, a radiação direta é radiante e chega com atraso.';
  }

  function vazio(x) { return x === null || x === undefined || x === '' || (typeof x === 'number' && isNaN(x)); }

  function avisos(E, cj, opc) {
    var lista = [], pj = E.projeto, rs = M.resumo(cj, pj), dm = H.dados.motor;
    function add(nivel, codigo, texto, rota) { lista.push({ nivel: nivel, codigo: codigo, texto: texto, rota: rota }); }

    // Sistema: D inválido na recirculação (o cálculo usa Ev = 0,75)
    if (rs.sistema.tipo === M.arExterior.SIS_RECIRC && !vazio(pj.dSistema) && !rs.sistema.dValido) {
      add('aviso', 'dSistema', 'D do sistema fora de 0 a 1: o cálculo usa Ev = 0,75.', '#/projeto');
    }
    // Ambientes: D e Ez gravados inválidos (o cálculo usa 1, como o motor: ar_exterior.js, vazoes)
    E.ambientes.forEach(function (amb, i) {
      var r = cj.ambientes[i], ar = amb.ar || {}, rota = '#/ambiente/' + i + '?bloco=ar';
      if (!vazio(ar.d) && (!isFinite(ar.d) || ar.d < 0)) add('aviso', 'dAmbiente', 'D inválido em ' + amb.nome + ': o cálculo usa 1.', rota);
      if (!vazio(ar.ez) && (!isFinite(ar.ez) || ar.ez <= 0)) add('aviso', 'ezAmbiente', 'Ez inválido em ' + amb.nome + ': o cálculo usa 1.', rota);
      if (r.adotados.retornoInvalido) add('aviso', 'retornoInvalido', amb.nome + ': retorno desconhecido: adotado forro plenum.', '#/ambiente/' + i + '?bloco=ilu');
      r.env.itens.forEach(function (el) {
        if (el.tipo !== 'Vidro') return;
        var onde = amb.nome + ', vidro ' + (NOME_FACE[el.face] || el.face), rf = '#/ambiente/' + i + '?bloco=env&face=' + el.face;
        if (el.aviso === 'semCredito') add('aviso', 'semCredito', onde + ': sem linha nas Tabelas 14A, 14B e 14G (ASHRAE Fundamentals 2021 cap. 15; p. 15.39 e 15.40, 15.40 e 15.41, 15.50 a 15.52) para o dispositivo; sombreamento sem crédito.', rf);
        if (el.aviso === 'fabricanteSemFr') add('info', 'fabricanteSemFr', onde + ': IAC do fabricante sem FR; adotada a fração radiante do vidro (' + f.num(el.frSomb, 2) + ').', rf);
        if (el.avisoEntrada === 'iacInvalido') add('aviso', 'iacInvalido', onde + ': IAC do fabricante fora de 0 a 1 (acima de 0): ignorado; sem crédito de sombreamento.', rf);
        var ie = r.env.itens.indexOf(el), sp = sombPico(cj.ambientes[i].meses[rs.mes][rs.dia], ie, pj);
        if (sp && sp.sobe) add('info', 'sombSobePico', textoSombPico(onde, sp), rf);
        if (el.avisoEntrada === 'frInvalido') add('aviso', 'frInvalido', onde + ': FR do fabricante fora de 0 a 1: ignorada; adotada a fração radiante do vidro.', rf);
        // Sombreamento externo (beiral, brise, lâminas): escolhido sem medidas não dá crédito; com medidas, lembra que a planilha não tem esta parte
        if (el.ext && el.ext.incompleto.length) {
          add('aviso', 'sombExtIncompleto', onde + ': sombreamento externo incompleto (' + el.ext.incompleto.map(function (e) { return e === 'h' ? 'proteção horizontal' : 'proteção vertical'; }).join(' e ') +
            '): falta a projeção ou a medida do vidro; calculado sem essa sombra.', rf);
        }
        if (el.ext && el.ext.ativa) {
          add('info', 'sombExterno', onde + ': ' + M.sombraExterna.descrever(el.ext, el.face) + '. A sombra reduz só a radiação direta do vidro (ASHRAE Fundamentals 2021 cap. 15, Eq. (33) a (36)); ' +
            'esta parte existe só no app, a planilha de conferência não a calcula.', rf);
        }
      });
      /* Calor sensível do ambiente (o número gravado no arquivo, que os difusores importam): maior valor das 24 h fora da janela de ocupação.

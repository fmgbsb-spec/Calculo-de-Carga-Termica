    return '<div class="campo"><label for="' + o.id + '">' + esc(o.rotulo) + '</label><div class="entrada">' +
      '<select id="' + o.id + '"' + (o.caminho ? ' data-caminho="' + o.caminho + '" data-tipo="sel"' : '') + (o.acaoSel ? ' data-acao-sel="' + o.acaoSel + '"' : '') + '>' + ops + '</select></div>' +
      '<div class="estado">' + (o.fonte ? selo('norma', o.seloTexto || 'fonte', o.fonte) : '') + '</div>' +
      (o.nota ? '<div class="fraco">' + esc(o.nota) + '</div>' : '') + '</div>';
  }

  function segmentado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div><div class="seg" role="group" aria-label="' + esc(o.rotulo) + '">' +
      o.opcoes.map(function (op) {
        return '<button type="button" data-acao="' + (o.acao || 'definir') + '" data-caminho="' + o.caminho + '"' + (o.campo ? ' data-campo="' + o.campo + '"' : '') + ' data-valor="' + esc(op.v) + '"' +
          (o.numerico ? ' data-numerico="1"' : '') + (o.booleano ? ' data-booleano="1"' : '') + ' aria-pressed="' + (op.v === o.valor) + '">' + esc(op.t) + '</button>';
      }).join('') + '</div></div>' + (o.fonte ? '<div class="estado">' + selo('norma', 'fonte', o.fonte) + '</div>' : '') + '</div>';
  }

  // Valor calculado: não se edita, e o clique abre a conta
  function calculado(o) {
    return '<div class="campo"><span class="rotulo">' + esc(o.rotulo) + '</span><div>' +
      '<button type="button" class="valor-calc num" data-acao="' + (o.chave ? 'conta' : 'fonte') + '"' +
      (o.chave ? ' data-chave="' + o.chave + '"' : ' data-fonte="' + esc(o.fonte || '') + '"') + '>' + esc(o.valor) +
      (o.unidade ? ' <small>' + esc(o.unidade) + '</small>' : '') + '</button></div>' +
      '<div class="estado">' + selo('calc', 'calculado') + (o.demo ? selo('demo', typeof o.demo === 'string' ? o.demo : 'valor do exemplo') : '') + '</div></div>';
  }

  function passos(lista) {
    return lista.map(function (p) {
      return '<div class="passo"><div class="q"><span>' + esc(p.passo) + '</span><span class="num">' + esc(p.resultado) + '</span></div>' +
        (p.formula ? '<div class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</div>' : '') +
        (p.fonte ? '<div class="fo">' + esc(p.fonte) + '</div>' : '') + '</div>';
    }).join('');
  }

  function aprender(html) {
    return daTela().aprender ? '<div class="aprender"><b>Por quê?</b> ' + html + '</div>' : '';
  }

  // Cabeçalho de tela: linha de contexto, título e texto de apoio (o texto aceita HTML do app)
  function cabeca(sobre, titulo, texto) {
    return '<div class="cabeca"><div class="sobre">' + esc(sobre) + '</div><h1>' + esc(titulo) + '</h1>' + (texto ? '<p>' + texto + '</p>' : '') + '</div>';
  }

  // Indicador: rótulo, valor e, se houver, uma linha de apoio
  function kpi(rotulo, valor, sub) {
    return '<div class="kpi-c"><span>' + rotulo + '</span><b class="num">' + valor + '</b>' + (sub ? '<span class="fraco">' + sub + '</span>' : '') + '</div>';
  }

  /* Bloco recolhível com frase-resumo. id (chave em U.aberto), n (número), titulo, frase, carga (valor à direita), rotuloCarga,
     corpo (função que devolve o HTML; só é chamada com o bloco aberto) */
  function bloco(id, n, titulo, frase, carga, rotuloCarga, corpo) {
    var aberto = !!(daTela().aberto || {})[id];
    return '<section class="bloco' + (aberto ? ' aberto' : '') + '" id="bloco-' + id + '">' +
      '<button type="button" class="bloco-cab" data-acao="bloco" data-bloco="' + id + '" aria-expanded="' + aberto + '">' +
        '<span class="n">' + n + '</span><span><span class="tit">' + titulo + '</span><span class="frase">' + esc(frase) + '</span></span>' +
        '<span class="carga num">' + carga + (rotuloCarga ? '<small>' + rotuloCarga + '</small>' : '') + '</span><span class="seta" aria-hidden="true">›</span>' +
      '</button>' + (aberto ? '<div class="bloco-corpo">' + corpo() + '</div>' : '') + '</section>';
  }

  /* Barras ordenadas da maior para a menor; cada linha abre a conta. lista = [{ chave, nome, valor }]; total = base do percentual;
     unidade = texto depois do valor; casas = casas decimais do valor (padrão 0) */
  function barras(lista, total, unidade, casas) {
    var max = 0, min = 0;
    lista.forEach(function (c) { max = Math.max(max, c.valor); min = Math.min(min, c.valor); });
    var faixa = (max - min) || 1, zero = (-min / faixa) * 100;
    var ordenado = lista.slice().sort(function (a, b) { return b.valor - a.valor; });
    return '<div class="barras">' + ordenado.map(function (c) {
      var larg = Math.abs(c.valor) / faixa * 100;
      var estilo = c.valor >= 0 ? 'left:' + zero.toFixed(2) + '%;width:' + larg.toFixed(2) + '%' : 'left:' + (zero - larg).toFixed(2) + '%;width:' + larg.toFixed(2) + '%';
      return '<div class="linha-b" data-acao="conta" data-chave="' + c.chave + '" role="button" tabindex="0" title="Abrir a conta">' +
        '<span class="nome">' + esc(c.nome) + '</span>' +
        '<span class="trilho"><span class="eixo" style="left:' + zero.toFixed(2) + '%"></span><span class="barra' + (c.valor < 0 ? ' neg' : '') + '" style="' + estilo + '"></span></span>' +
        '<span class="v">' + f.num(c.valor, casas || 0) + (unidade ? ' ' + unidade : '') + '</span><span class="p">' + f.num(c.valor / total * 100, 0) + ' %</span></div>';
    }).join('') + '</div>';
  }

  // Os mesmos passos da gaveta, em tabela, para a folha do memorial
  function tabPassos(lista) {
    return '<table class="passos-t"><thead><tr><th>Passo</th><th>Fórmula e valores</th><th class="num">Resultado</th><th>Fonte</th></tr></thead><tbody>' +
      lista.map(function (p) {
        return '<tr><td>' + esc(p.passo) + '</td><td class="f">' + esc(p.formula) + (p.valores ? ' = ' + esc(p.valores) : '') + '</td><td class="num">' + esc(p.resultado) + '</td><td>' + esc(p.fonte) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* Lista de cartões do celular (v0.4.0): oculta no computador (o app desenha também a tabela, marcada com .so-computador).
     itens = [{ href (tela que o cartão abre; sem href o cartão não é link), titulo, sub (texto depois do título),
     valores: [{ r (rótulo), v (valor já formatado), u (unidade) }] (valor vazio ou "—" não aparece), situacao (HTML do app),
     destaque (bool: barra lateral, como o circuito crítico) }] */
  function cartoes(itens) {
    return '<ul class="cel-cartoes">' + itens.map(function (x) {
      var vals = (x.valores || []).filter(function (v) { return v && v.v !== undefined && v.v !== null && v.v !== '' && v.v !== '—'; }).map(function (v) {
        return '<span><small>' + esc(v.r) + '</small>' + esc(v.v) + (v.u ? ' ' + esc(v.u) : '') + '</span>';
      }).join('');
      var tag = x.href ? 'a' : 'div', corpo = '<span class="cel-c-tit"><b>' + esc(x.titulo) + '</b>' + (x.sub ? ' <span>· ' + esc(x.sub) + '</span>' : '') + '</span>' +
        (x.href ? '<span class="cel-c-seta" aria-hidden="true">›</span>' : '') + (vals ? '<span class="cel-c-vals num">' + vals + '</span>' : '') +
        (x.situacao ? '<span class="cel-c-sit">' + x.situacao + '</span>' : '');
      return '<li><' + tag + ' class="cel-cartao' + (x.destaque ? ' destaque' : '') + '"' + (x.href ? ' href="' + esc(x.href) + '"' : '') + '>' + corpo + '</' + tag + '></li>';
    }).join('') + '</ul>';
  }

  H.ui.c = { selo: selo, campo: campo, texto: texto, seletor: seletor, segmentado: segmentado, calculado: calculado, passos: passos, aprender: aprender,
             cabeca: cabeca, kpi: kpi, bloco: bloco, barras: barras, tabPassos: tabPassos, cartoes: cartoes };
})(window.HVAC);

</script>
<script>
/* ==== plataforma v0.4.0: js/interface/casca.js ==== */
/* Plataforma HVAC. Casca comum dos apps: estado, armazenamento, rotas, trilha, faixa de resultado, gaveta, janela, paleta de comandos,
   tema, modo aprendizado, arquivo de projeto com relatório de importação e impressão do memorial; desde a v0.4.0, o celular
   (Menu, barra de passos, Voltar, dica por toque, tabelas que rolam, memorial em escala, teclado), só com a tela estreita.
   Tudo o que é próprio do app vem do manifesto H.app (contrato em docs\GUIA_INTERFACE.md). A casca não conhece motor nenhum:
   só chama as funções do manifesto. Carrega depois de componentes.js e antes dos arquivos do app; o manifesto é lido em iniciar(). */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc;
  var CHAVE_PREF = 'hvac.preferencias.v1';     // tema e modo aprendizado: a mesma chave em todos os apps

  var A = null;                               // manifesto do app (H.app)
  var E = null;                               // projeto (o que vai para o arquivo)
  var U = H.ui.U = {                          // estado da tela (não vai para o arquivo); o app acrescenta os seus campos em H.app.estado
    tela: 'inicio', temIndice: false, aberto: {}, aprender: false, tema: 'claro', erros: {}, delta: 0, sobre: null, paleta: null
  };
  var clicarDepois = null;                    // seletor do parâmetro de teste ?clicar=, à espera do próximo desenho
  var digitarDepois = null;                   // "<id>:<valor>" do parâmetro de teste ?digitar=, à espera do próximo desenho
  var despejar = false;                       // parâmetro de teste ?despejar=1: o texto do arquivo vai para a página a cada desenho
  function tem(o, k) { return !!o && Object.prototype.hasOwnProperty.call(o, k); }

  // ------------------------------------------------------------ armazenamento (o app funciona sem ele)
  function guardar() { try { localStorage.setItem(A.chave, JSON.stringify(E)); } catch (e) { /* sem armazenamento: segue em memória */ } }
  function guardarPref() { try { localStorage.setItem(CHAVE_PREF, JSON.stringify({ aprender: U.aprender, tema: U.tema })); } catch (e) { /* idem */ } }
  function contar(rel, nivel) { var n = 0; rel.forEach(function (x) { if (x.nivel === nivel) n++; }); return n; }
  // O relatório abre sozinho quando o arquivo veio de formato anterior ou quando algum valor foi substituído
  function pedeRelatorio(r) { return r.versaoOrigem < A.arquivo.versao || contar(r.relatorio, 'substituido') > 0; }
  function carregar() {
    try {
      var p = JSON.parse(localStorage.getItem(CHAVE_PREF) || 'null');
      if (p) { U.aprender = !!p.aprender; U.tema = p.tema === 'escuro' ? 'escuro' : 'claro'; }
      else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) U.tema = 'escuro';
      var s = JSON.parse(localStorage.getItem(A.chave) || 'null');
      if (s) {
        var r = A.arquivo.abrir(s);
        if (r.ok) {
          // mesmo caminho de importarTexto: relatório guardado e aberto na primeira tela quando houve conversão de formato ou substituição
          U.mostrarNaAbertura = pedeRelatorio(r);
          if (U.mostrarNaAbertura) U.importacao = { nome: 'projeto guardado no navegador', versaoOrigem: r.versaoOrigem, relatorio: r.relatorio, quando: fmtQuando() };
          return r.projeto;
        }
      }
    } catch (e) { /* dado ilegível: abre o exemplo */ }
    return A.arquivo.exemplo();
  }

  // ------------------------------------------------------------ importação (arquivo de projeto e parâmetro de teste ?importar=)
  function fmtQuando() {
    var d = new Date(), z = function (n) { return ('0' + n).slice(-2); };
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function htmlNaoAbriu(motivo) {
    return '<h2>Não foi possível abrir</h2><p>' + esc(motivo) + '</p><div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Fechar</button></div>';
  }
  /* Abre o projeto lido do texto do arquivo. opc.semGuardar: não grava no localStorage (parâmetro de teste); opc.irParaProjeto: navega

    r = A.arquivo.abrir(obj);

  }
  // Linhas do relatório: { onde, campo, nivel ('info' | 'convertido' | 'mantido' | 'substituido'), valorArquivo, valorAdotado, motivo }
  var SELO_NIVEL = { substituido: ' <span class="selo alterado">alterado</span>', mantido: ' <span class="selo mantido">mantido</span>' };
  var NIVEL_TXT = { info: 'INFO', convertido: 'CONVERTIDO', mantido: 'MANTIDO', substituido: 'SUBSTITUÍDO' };
  var BOTOES_REL = '<div class="acoes" style="margin-top:12px"><button class="botao prim" data-acao="fechar">Continuar</button><button class="botao" data-acao="salvar-relatorio">Salvar relatório (.txt)</button></div>';
  function htmlLinhas(rel) {
    return '<div class="tabela-rolo" style="max-height:52vh;overflow:auto"><table><thead><tr><th>Onde</th><th>Campo</th><th>No arquivo</th><th>Adotado</th><th>Motivo</th></tr></thead><tbody>' +
      rel.map(function (x) {
        return '<tr><td>' + esc(x.onde) + '</td><td>' + esc(x.campo) + (tem(SELO_NIVEL, x.nivel) ? SELO_NIVEL[x.nivel] : '') + '</td><td>' + esc(x.valorArquivo) + '</td><td>' +
          esc(x.valorAdotado) + '</td><td>' + esc(x.motivo) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  // "N conversões · N valores seus mantidos · N substituições"; o trecho dos mantidos só aparece quando há algum
  function contagem(rel) {
    var nc = contar(rel, 'convertido'), nm = contar(rel, 'mantido'), ns = contar(rel, 'substituido');
    return nc + (nc === 1 ? ' conversão' : ' conversões') + (nm ? ' · ' + nm + (nm === 1 ? ' valor seu mantido' : ' valores seus mantidos') : '') +
      ' · ' + ns + (ns === 1 ? ' substituição' : ' substituições');
  }
  function htmlImportacao() {
    var im = U.importacao, rel = im.relatorio;
    return '<h2>Relatório de importação</h2><p class="suave" style="margin-bottom:10px">Arquivo <b>' + esc(im.nome) + '</b> · formato da versão ' + im.versaoOrigem + ' → ' + A.arquivo.versao + ' · ' +
      contagem(rel) + ' · ' + esc(im.quando) + '</p>' +
      (rel.length ? htmlLinhas(rel) : '<p>Nenhuma alteração foi necessária.</p>') + BOTOES_REL;
  }
  /* Relatório avulso (H.ui.api.relatorio): a mesma janela do relatório do arquivo de projeto, para qualquer importação do app.
     r = { linhas, titulo, nome (arquivo de origem), resumo (frase em destaque), texto (conteúdo do .txt), arquivoTxt (nome do .txt), manter } */
  function htmlRelatorio(r) {
    return '<h2>' + esc(r.titulo) + '</h2><p class="suave" style="margin-bottom:10px">' + (r.nome ? 'Arquivo <b>' + esc(r.nome) + '</b> · ' : '') + contagem(r.linhas) + ' · ' + esc(r.quando) + '</p>' +
      (r.resumo ? '<p style="margin-bottom:10px"><b>' + esc(r.resumo) + '</b></p>' : '') +
      (r.linhas.length ? htmlLinhas(r.linhas) : (r.resumo ? '' : '<p>Nenhuma alteração foi necessária.</p>')) + BOTOES_REL;
  }
  function textoRelatorioAvulso(r) {
    var l = [r.titulo];
    if (r.nome) l.push('Arquivo: ' + r.nome);
    l.push(contagem(r.linhas) + ' · ' + r.quando);
    if (r.resumo) l.push(r.resumo);
    l.push('');
    r.linhas.forEach(function (x) {
      l.push('[' + (tem(NIVEL_TXT, x.nivel) ? NIVEL_TXT[x.nivel] : String(x.nivel)) + '] ' + x.onde + ' · ' + x.campo + ': no arquivo "' + x.valorArquivo + '", adotado "' + x.valorAdotado + '". ' + x.motivo);
    });
    return l.join('\r\n');
  }
  function abrirRelatorio(r) {
    r = r || {};
    var rel = { linhas: r.linhas || [], titulo: r.titulo || 'Relatório de importação', nome: r.nome || '', resumo: r.resumo || '', texto: r.texto, arquivoTxt: r.arquivoTxt, quando: fmtQuando() };
    U.sobre = { tipo: 'janela', html: htmlRelatorio(rel), manter: !!r.manter, relatorio: rel };
  }
  function nomeTxt(nome) { return String(nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao.txt'; }
  function baixar(conteudo, tipo, nome) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
    a.download = nome;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }
  // Salva o relatório que está na janela: o avulso (H.ui.api.relatorio), se for ele; senão, o do arquivo de projeto
  function salvarRelatorio() {
    var av = U.sobre && U.sobre.relatorio;
    if (av) { baixar('﻿' + (typeof av.texto === 'string' ? av.texto : textoRelatorioAvulso(av)), 'text/plain;charset=utf-8', av.arquivoTxt || nomeTxt(av.nome || 'relatorio')); return; }
    var im = U.importacao; if (!im) return;
    baixar('﻿' + A.arquivo.textoRelatorio({ relatorio: im.relatorio, versaoOrigem: im.versaoOrigem }, im.nome), 'text/plain;charset=utf-8',
      String(im.nome).replace(/\.json$/i, '').replace(/[^\wÀ-ú]+/g, '_') + '_relatorio_importacao.txt');
  }
  function decodificarBase64(b64) {
    var bin = atob(b64.replace(/-/g, '+').replace(/_/g, '/')), pct = '', i;
    for (i = 0; i < bin.length; i++) pct += '%' + ('0' + bin.charCodeAt(i).toString(16)).slice(-2);
    return decodeURIComponent(pct);

  // ------------------------------------------------------------ rotas: #/tela/indice?chave=valor
  /* Parâmetros de endereço da casca (usados em testes e capturas): importar, bloco, tema, aprender, conta, clicar, digitar, despejar.
     Os do app ficam em A.parametros = { nome: function (valor, U) }; se o app declara "clicar", "digitar" ou "despejar", vale o dele
     e a casca não age nesse parâmetro. */
  function lerRota() {
    var h = (location.hash || '#/inicio').replace(/^#\/?/, ''), partes = h.split('?');
    var seg = partes[0].split('/');
    U.tela = tem(A.rotas, seg[0]) ? seg[0] : 'inicio';
    var rota = A.rotas[U.tela];
    if (rota.indice) U[rota.indice] = Math.max(0, parseInt(seg[1], 10) || 0);
    U.temIndice = !!rota.indice && /^\d+/.test(seg[1] || '');   // "#/rota/N" trouxe o índice; "#/rota" não (U[rota.indice] vale 0 nos dois casos)
    (partes[1] || '').split('&').forEach(function (par) {
      var ig = par.indexOf('='), kv = ig < 0 ? [par, ''] : [par.slice(0, ig), par.slice(ig + 1)];
      if (kv[0] === 'importar') {   // parâmetro de teste: JSON em base64 (UTF-8); passa pela mesma importação, sem gravar no localStorage
        try { importarTexto(decodificarBase64(kv[1]), '(parâmetro ?importar=)', { semGuardar: true }); }
        catch (e) { U.sobre = { tipo: 'janela', html: htmlNaoAbriu('O parâmetro ?importar= não contém um JSON em base64.') }; }
      }
      if (kv[0] === 'bloco') { U.aberto = {}; kv[1].split(',').forEach(function (b) { U.aberto[b] = true; }); }
      if (kv[0] === 'tema') U.tema = kv[1] === 'escuro' ? 'escuro' : 'claro';
      if (kv[0] === 'aprender') U.aprender = kv[1] === '1';
      if (tem(A.parametros, kv[0])) A.parametros[kv[0]](kv[1], U);
      if (kv[0] === 'conta') abrirConta(kv[1]);
      if (kv[0] === 'clicar' && !tem(A.parametros, 'clicar')) clicarDepois = kv[1];   // parâmetro de teste: clique depois do próximo desenho
      if (kv[0] === 'digitar' && !tem(A.parametros, 'digitar')) {                     // parâmetro de teste: digitação depois do próximo desenho
        try { digitarDepois = decodeURIComponent(kv[1]); } catch (e) { digitarDepois = null; }
      }
      if (kv[0] === 'despejar' && !tem(A.parametros, 'despejar')) despejar = kv[1] === '1';
    });
  }
  // ?digitar=<id do campo>:<valor>: escreve o valor no elemento e dispara o evento de alteração, que é o caminho de quem digita na tela;
  // texto sem ":" ou elemento ausente são ignorados
  function digitar(texto) {

  // Barra de passos embaixo (C3): anterior · atual (abre a lista dos passos) · próximo; rota fora da trilha mostra "Ver os passos"
  function indicePasso() {
    var ativa = A.rotas[U.tela].passo || U.tela, k;

      return '<a href="#/' + tr[j].r + '" aria-label="' + rot + ': ' + esc(tr[j].t) + '">' + seta + '<small>' + esc(tr[j].t) + '</small></a>';

        '<b>' + esc(x.t) + '</b><small' + (x.pend && x.pend(E, R) ? ' class="pend"' : '') + '>' + esc(x.s ? x.s(E, R) : '') + '</small></button>';
    } else {
      meio = '<button type="button" class="atual" id="cel-lista-passos" data-acao="passos"><small>' + (U.tela === 'inicio' ? 'Início' : 'Fora da trilha') + '</small><b>Ver os passos</b></button>';

  function htmlListaPassos() {

      '<div class="acoes" style="margin-top:12px"><a class="botao" href="#/inicio">Início</a>' + (tem(A.rotas, 'referencias') ? '<a class="botao" href="#/referencias">Referências</a>' : '') +

  // Tabelas de leitura (C13): tabela solta ganha o quadro que rola (fora da folha e das tabelas empilháveis) e o aviso quando não cabe
  function quadrosDeLeitura() {
    Array.prototype.forEach.call(document.querySelectorAll('#tela table'), function (t) {
      if (t.closest('.folha') || t.classList.contains('empilha')) return;
      var rolo = t.closest('.tabela-rolo');
      if (!rolo) { rolo = document.createElement('div'); rolo.className = 'tabela-rolo'; t.parentNode.insertBefore(rolo, t); rolo.appendChild(t); }
      var antes = rolo.previousElementSibling;
      if (rolo.scrollWidth > rolo.clientWidth + 1 && !(antes && antes.classList.contains('cel-rolar'))) {
        rolo.insertAdjacentHTML('beforebegin', '<p class="cel-rolar">Arraste a tabela para o lado para ver as outras colunas →</p>');
      }
    });
  }

  // Memorial em escala (C14): na rota que imprime, cada folha é desenhada na largura do papel (o max-width dela) e encolhida até caber
  function folhasEmEscala() {
    if (!A.rotas[U.tela].imprime) return;
    Array.prototype.forEach.call(document.querySelectorAll('#tela .folha'), function (f) {
      if (f.parentNode.closest('.folha') || f.parentNode.classList.contains('cel-moldura')) return;
      var papel = parseFloat(window.getComputedStyle(f).maxWidth), m = document.createElement('div');
      m.className = 'cel-moldura';
      f.parentNode.insertBefore(m, f); m.appendChild(f);
      f.style.width = (papel > 0 && isFinite(papel) ? papel : 800) + 'px';
    });
    escalarFolhas();
  }
  function escalarFolhas() {
    Array.prototype.forEach.call(document.querySelectorAll('#tela .cel-moldura'), function (m) {
      var f = m.firstElementChild, s;
      if (!f) return;
      if (!celular() || m.classList.contains('real')) { f.style.transform = ''; m.style.height = ''; return; }
      s = Math.min(1, m.clientWidth / f.offsetWidth);
      f.style.transform = 'scale(' + s + ')';
      m.style.height = Math.ceil(f.offsetHeight * s) + 'px';
    });
  }
  window.addEventListener('resize', function () { if (celular()) escalarFolhas(); });

  // Depois de cada desenho: barra de passos, quadros das tabelas e folha em escala; na tela larga, só garante a barra vazia
  function ajustarCelular(R) {

  // Dica por toque (C10): o title do elemento (que o computador mostra ao passar o mouse) num balão por 5 s
  var relogioDica = null;

  // Voltar do aparelho (C9): com gaveta ou janela aberta em tela estreita, a casca empilha uma entrada no histórico (sem mudar o
  // endereço); o Voltar fecha a camada e fica na mesma tela. Fechar pelo × ou tocando fora tira a entrada.
  var empilhou = false;

    if (U.sobre && !empilhou && celular()) { try { history.pushState({ hvacSobre: true }, ''); empilhou = true; } catch (e) { /* sem histórico: segue */ } }
    else if (!U.sobre && empilhou) { empilhou = false; if (history.state && history.state.hvacSobre) history.back(); }
  }
  window.addEventListener('popstate', function () {
    if (empilhou && U.sobre) { empilhou = false; U.sobre = null; desenharSobre(); }
  });

  // Teclado aberto (C15): com um campo de digitação em foco, a barra de passos e a faixa somem (classe no body, só em tela estreita)
  function campoDeDigitar(el) {
    if (!el || el.readOnly || el.disabled) return false;
    if (el.tagName === 'TEXTAREA') return true;
    return el.tagName === 'INPUT' && !/^(checkbox|radio|file|button|submit|reset|range|color)$/i.test(el.type);
  }
  document.addEventListener('focusin', function (ev) { if (celular() && campoDeDigitar(ev.target)) document.body.classList.add('cel-digitando'); });
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (!campoDeDigitar(document.activeElement)) document.body.classList.remove('cel-digitando'); }, 0);
  });

  // Troca entre tela estreita e larga (girar o aparelho, mudar a janela): redesenha, para pôr ou tirar o que é do celular
  function aoMudarLargura() {

  if (estreita.addEventListener) estreita.addEventListener('change', aoMudarLargura);
  else if (estreita.addListener) estreita.addListener(aoMudarLargura);

  // ------------------------------------------------------------ o que a casca oferece ao app
  H.ui.projeto = function () { return E; };
  H.ui.api = {
    projeto: function () { return E; },
    guardar: guardar,

    janela: function (html, opc) { U.sobre = { tipo: 'janela', html: html, manter: !!(opc && opc.manter) }; },   // opc.manter: sobrevive à próxima troca de endereço
    relatorio: abrirRelatorio,                // relatório avulso: { linhas, titulo, nome, resumo, texto, arquivoTxt, manter }
    textoArquivo: textoArquivo,               // o texto do arquivo de projeto como seria salvo (apoio a teste)
    fechar: function () { U.sobre = null; },
    acoes: ACOES,
    celular: celular,                         // v0.4.0: true com a tela estreita (até 760 px, só na tela)
    dica: dica                                // v0.4.0: balão de dica por 5 s (só age com a tela estreita)
  };

  // Topo: nome do app, rótulo de versão, ícone próprio (opcional) e botão de ajuda (só quando o manifesto traz itens de ajuda)
  function montarTopo() {
    document.getElementById('marca-nome').innerHTML = esc(A.nome) + (A.rotuloVersao ? ' <small>' + esc(A.rotuloVersao) + '</small>' : '');
    if (A.icone) { var svg = document.querySelector('.marca svg'); if (svg) svg.outerHTML = A.icone; }
    if (A.ajuda && A.ajuda.length && !document.getElementById('b-ajuda')) {
      document.getElementById('topo-acoes').insertAdjacentHTML('afterbegin', '<button class="icone" id="b-ajuda" data-acao="ajuda">Ajuda</button>');
    }
  }

  H.ui.iniciar = function () {

  /* Textos e valores de clima conforme a frequência de projeto do projeto (0,4 / 1 / 2 %): tbs, tbu e fontes das Tabelas A.4, A.5 e A.6 da ABNT NBR 16401-1:2024

  function climaDe(proj) {

        C.selo('norma', 'fonte', 'ABNT NBR 16401-1:2024 5.1.1.2: a) dimensionar com tbs e tbu coincidente; b) verificar com tbu máxima e tbs coincidente; d) sistemas de baixa umidade: umidade máxima e tbs coincidente. ' + clima.fonteClima + '. ' + clima.fonteTbu + '. ' + clima.fonteUmi + '.') + '</p>' +

  // ---------------------------------------------------------------- Editor de ambiente
  function semCalculo(res, face) {
    return res.env.avisos.filter(function (av) { return av.face === face; });
  }

  function croqui(amb, res) {
    var cargas = H.motor.cargaPorFace(res), sel = H.ui.U.face, max = 1, k;
    for (k in cargas) max = Math.max(max, cargas[k]);
    function rotuloCarga(face) {
      var fc = amb.faces[face];
      if (fc.cond === 'interna') return 'sem troca';
      return f.num(cargas[face], 0) + ' W' + (semCalculo(res, face).length ? ' (!)' : '');
    }
    function parede(face, x, y, w, h) {

      if (fc.cond === 'externa') s += '<rect class="parede" x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="3" opacity="' + (0.35 + 0.65 * Math.max(0, cargas[face]) / max).toFixed(2) + '"/>';
      else if (fc.cond === 'divisoria') s += '<rect class="divisoria" x="' + (x + 1) + '" y="' + (y + 1) + '" width="' + (w - 2) + '" height="' + (h - 2) + '" rx="3"/>';
      else s += horiz ? '<rect class="interna" x="' + x + '" y="' + (y + h / 2 - 2) + '" width="' + w + '" height="4"/>'
                      : '<rect class="interna" x="' + (x + w / 2 - 2) + '" y="' + y + '" width="4" height="' + h + '"/>';
      var bruto = fc.parede + fc.vidro + fc.porta;
      if (fc.cond === 'externa' && fc.vidro > 0 && bruto > 0) {
        var fr = fc.vidro / bruto;
        s += horiz ? '<rect class="vidro" x="' + (x + w * (1 - fr) / 2) + '" y="' + (y + 3) + '" width="' + (w * fr) + '" height="' + (h - 6) + '" rx="2"/>'
                   : '<rect class="vidro" x="' + (x + 3) + '" y="' + (y + h * (1 - fr) / 2) + '" width="' + (w - 6) + '" height="' + (h * fr) + '" rx="2"/>';

      '<text class="rot" x="72" y="146" text-anchor="end">Oeste</text><text x="72" y="162" text-anchor="end">' + rotuloCarga('O') + '</text><text x="72" y="182" text-anchor="end">sol da tarde</text>' +
      '<text class="rot" x="328" y="146">Leste</text><text x="328" y="162">' + rotuloCarga('L') + '</text><text x="328" y="182">sol da manhã</text>' +
      '<g transform="translate(366 34)"><circle class="rosa" r="15"/><path class="rosa-n" d="M0 -12 L5 3 L0 0 L-5 3 Z"/><text x="0" y="-19" text-anchor="middle" class="rot">N</text></g>' +

  /* Sombreamento interno do vidro em cascata: tipo e, conforme o tipo, cor e posição, cor e trama, modelo ou valores do fabricante.

  function sombreamento(fc, cam, face, res) {
    var S = FM.somb, d = S.decompor(fc.somb), tipo = d.tipo || 'nenhum', cs = cam + 'somb', s;

      C.segmentado({ rotulo: 'Posição', caminho: cs, acao: 'somb-opc', campo: 'pos', valor: d.pos, opcoes: [{ v: 'aberta (0°)', t: 'Aberta (0°)' }, { v: 'a 45°', t: '45°' }, { v: 'fechada', t: 'Fechada' }] }) + '</div>';
    if (tipo === 'cortina') s += '<div class="grade g2" style="margin-top:12px">' +
      C.segmentado({ rotulo: 'Tecido', caminho: cs, acao: 'somb-opc', campo: 'voil', valor: d.voil ? '1' : '0', opcoes: [{ v: '0', t: 'Comum' }, { v: '1', t: 'Leve (voil)' }] }) +
      (d.voil ? '' : C.segmentado({ rotulo: 'Cor', caminho: cs, acao: 'somb-opc', campo: 'cor', valor: d.cor, opcoes: CORES }) +
        C.segmentado({ rotulo: 'Trama', caminho: cs, acao: 'somb-opc', campo: 'trama', valor: d.trama, opcoes: [{ v: 'fechada', t: 'Fechada' }, { v: 'semiaberta', t: 'Semiaberta' }, { v: 'aberta', t: 'Aberta' }] })) + '</div>';
    if (tipo === 'rolo') s += '<div class="grade g2" style="margin-top:12px">' +
      C.seletor({ id: 'f-rolo', caminho: cs, rotulo: 'Modelo', valor: fc.somb, opcoes: S.ROLOS }) + '</div>';
    if (tipo === 'fabricante') s += '<div class="grade" style="margin-top:12px">' +
      C.campo({ id: 'f-iac', caminho: cam + 'sombIac', rotulo: 'IAC do fabricante', valor: fc.sombIac === undefined ? null : fc.sombIac, casas: 2, anulavel: true, min: 0.01, max: 1,

      if (el.aviso === 'semCredito') s += '<div class="aviso" style="margin:10px 0 0">Este vidro não tem linha nas Tabelas 14A, 14B e 14G do ASHRAE Fundamentals 2021 cap. 15 (IAC) para o dispositivo escolhido: o cálculo não dá crédito ao sombreamento. Se tiver os dados do fabricante, escolha \'Valores do fabricante\'.</div>';
      var spb = res.meses && res.adotado ? H.motor.sombPico(res.meses[res.adotado.mes][res.adotado.dia], res.env.itens.indexOf(el), H.ui.projeto().projeto) : null;

  /* Sombreamento externo do vidro (beiral, brise lateral e lâminas repetidas; sessão C2, v0.5.1): proteção horizontal e proteção vertical; as medidas
     só aparecem depois da escolha. Grava faces.X.extH, extHProj, extHAlt, extHFolga, extV, extVProj, extVLarg, extVFolga e extVLado (motor em

  function sombExterno(fc, cam, face, res) {
    var SE = H.motor.sombraExterna, th = fc.extH || '', tv = fc.extV || '', card = SE.CARDEAL[face] || { esq: '', dir: '' }, s;

    if (tv === 'laminas') s += '<div class="grade" style="margin-top:12px">' + med('f-ext-vp', 'extVProj', 'Profundidade da lâmina', 0, 2) + med('f-ext-vl', 'extVLarg', 'Espaçamento entre lâminas', 0.02, 5) + '</div>';
    if (th || tv) s += '<p class="ficha">A sombra reduz só a radiação direta; a difusa entra inteira. Vale para beiral bem mais largo que a janela e brise mais alto que ela, com as janelas da face iguais' +

      for (var h = 0; h < 24; h++) { sSem += sem[h]; sCom += res.elem[ie].dir[h]; }
      s += '<p class="ficha">Adotado pelo cálculo: <b>' + esc(SE.descrever(el.ext, face)) + '</b>. Em ' + H.motor.MESES[res.mes - 1] + ', às ' + res.horaPico + ' h (pico do ambiente), a fração ensolarada do vidro é <b class="num">' +

      '</div><div class="grade" style="margin-top:12px">' +

  // Explica o latente do ar exterior nos dois dias e por que o valor negativo não reduz a capacidade

  function ambiente(E, i) {

  var BTU_POR_W = 3.41214;

  function mes(n) { return M.MESES[n - 1]; }
  function numBtn(chave, texto) { return '<button type="button" class="valor-calc num" data-acao="conta" data-chave="' + chave + '" title="Abrir a conta">' + texto + '</button>'; }

  // Componentes da carga do ambiente na hora do pico do sistema (cj.ambSis), mais as duas parcelas que fazem a capacidade do sistema
  function composicao(cj, projeto) {
    var rs = M.resumo(cj, projeto), lista = M.COMPONENTES.map(function (c) {
      var v = 0;
      cj.ambSis.forEach(function (r) { v += r.pico[c.id]; });
      return { id: c.id, chave: c.id, nome: c.nome, valor: v };
    });
    lista.push({ id: 'retorno', chave: 'capacidade', nome: 'Iluminação ao retorno', valor: rs.ponte.retornoHora });
    if (rs.ponte.acrescimo > 0) lista.push({ id: 'acrescimo', chave: 'sistema', nome: 'Acréscimo de ar exterior do sistema', valor: rs.ponte.acrescimo });
    return lista;
  }

  function barras(comp, total) { return C.barras(comp, total, 'W'); }   // componente comum (plataforma)

  // Perfil de 24 h da combinação adotada: capacidade do sistema (linha cheia), carga do ambiente (tracejada), janela de ocupação e pico marcados
  function perfil(cj, projeto, rs) {
    var L = 760, A = 270, m = { e: 58, d: 16, t: 34, b: 30 }, i, cap = cj.sistema.series.cap, amb = cj.total;
    var max = Math.max.apply(null, cap.concat(amb)), min = Math.min(0, Math.min.apply(null, cap.concat(amb)));
    var passo = Math.pow(10, Math.floor(Math.log(Math.max(max - min, 1)) / Math.LN10));
    if ((max - min) / passo < 2) passo /= 4; else if ((max - min) / passo < 4) passo /= 2; else if ((max - min) / passo > 8) passo *= 2;
    var topo = Math.ceil(max / passo) * passo, base = Math.floor(min / passo) * passo;
    function x(h) { return m.e + (h - 1) / 23 * (L - m.e - m.d); }
    function y(v) { return m.t + (topo - v) / (topo - base) * (A - m.t - m.b); }
    function linha(serie) { return serie.map(function (v, k) { return (k ? 'L' : 'M') + x(k + 1).toFixed(1) + ' ' + y(v).toFixed(1); }).join(' '); }
    var s = '<svg class="graf" viewBox="0 0 ' + L + ' ' + A + '" role="img" aria-label="Perfil horário: capacidade do sistema com pico de ' + f.num(rs.capSistemaW, 0) + ' W às ' + rs.hora + ' horas e carga do ambiente">';
    s += '<rect class="ocupacao" x="' + x(projeto.hIni) + '" y="' + m.t + '" width="' + (x(projeto.hFim) - x(projeto.hIni)) + '" height="' + (A - m.t - m.b) + '"/>';
    for (var v = base; v <= topo + 1e-6; v += passo) {
      s += '<line class="grade-l' + (Math.abs(v) < 1e-6 ? ' zero' : '') + '" x1="' + m.e + '" x2="' + (L - m.d) + '" y1="' + y(v) + '" y2="' + y(v) + '"/>' +
        '<text x="' + (m.e - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + f.num(v, 0) + '</text>';
    }
    for (i = 2; i <= 24; i += 2) s += '<text x="' + x(i) + '" y="' + (A - 10) + '" text-anchor="middle">' + i + ' h</text>';
    s += '<text x="' + (m.e - 8) + '" y="' + (m.t - 16) + '" text-anchor="end">W</text>';
    s += '<path class="l-sens" d="' + linha(amb) + '"/><path class="l-total" d="' + linha(cap) + '"/>';
    s += '<line class="cursor oculto" id="graf-cursor" x1="0" x2="0" y1="' + m.t + '" y2="' + (A - m.b) + '"/>';
    var px = x(rs.hora), py = y(rs.capSistemaW);
    s += '<circle class="pico" cx="' + px + '" cy="' + py + '" r="5"/>' +
      '<text class="rot-d" x="' + px + '" y="' + (py - 14) + '" text-anchor="middle">pico de ' + f.num(rs.capSistemaW, 0) + ' W às ' + rs.hora + ' h</text>';
    s += '<rect id="graf-area" x="' + m.e + '" y="' + m.t + '" width="' + (L - m.e - m.d) + '" height="' + (A - m.t - m.b) + '" fill="transparent"/></svg>';
    return '<div class="legenda"><span><i></i>Capacidade do sistema</span><span><i class="s"></i>Carga do ambiente</span><span><i class="j"></i>Ocupação (' + projeto.hIni + ' h às ' + projeto.hFim + ' h)</span></div>' +
      '<div class="graf-caixa" id="graf-caixa" data-me="' + m.e + '" data-md="' + m.d + '" data-l="' + L + '">' + s + '<div class="dica oculto" id="graf-dica"></div></div>';
  }

  // Tabela equivalente ao gráfico: hora, sensível, latente líquido, carga do ambiente, retorno, acréscimo, capacidade (combinação adotada, conjunto)
  function tabelaHoraria(cj, rs) {
    var sr = cj.sistema.series, linhas = '';
    for (var h = 1; h <= 24; h++) {
      var i = h - 1;
      linhas += '<tr' + (h === rs.hora ? ' class="total"' : '') + '><td class="num">' + h + ' h</td><td class="num">' + f.num(cj.sens[i], 0) + '</td><td class="num">' +
        f.num(cj.lat[i], 0) + '</td><td class="num">' + f.num(cj.total[i], 0) + '</td><td class="num">' + f.num(sr.capAmb[i] - cj.total[i], 0) + '</td><td class="num">' +
        f.num(sr.acr[i], 0) + '</td><td class="num">' + f.num(sr.cap[i], 0) + '</td></tr>';
    }
    return '<div class="tabela-rolo"><table><thead><tr><th class="num">Hora</th><th class="num">Sensível (W)</th><th class="num">Latente líquido (W)</th><th class="num">Carga do ambiente (W)</th>' +
      '<th class="num">Retorno (W)</th><th class="num">Acréscimo de ar exterior (W)</th><th class="num">Capacidade (W)</th></tr></thead><tbody>' + linhas + '</tbody></table></div>';
  }

  /* Varredura dos 12 meses: meses = [{ mes, nomeMes, dias: { tbs|tbu|umi: { conta, totalW, horaTotal, capW, horaCap, adotado, ambiente } } }].
     Combinação adotada em negrito com o selo "adotado"; a de maior carga do ambiente, quando é outra, com o selo próprio */
  function tabelaVarredura(meses, rotuloCap) {
    var cab1 = '<tr><th rowspan="2">Mês</th>', cab2 = '<tr>';
    M.DIAS.forEach(function (dia) {
      var conta = meses[0].dias[dia].conta;
      cab1 += '<th colspan="2" class="num">Dia de ' + (dia === 'tbs' ? 'tbs máxima' : dia === 'tbu' ? 'tbu máxima' : 'umidade máxima') + (conta ? '' : ' <span class="selo demo">só para conferência</span>') + '</th>';
      cab2 += '<th class="num" title="Carga do ambiente (W)">Ambiente (W)</th><th class="num" title="' + rotuloCap + ' (W)">Capacidade (W)</th>';
    });
    function cel(v, cap) {
      var cls = 'num' + (v.adotado ? ' adotado' : '') + (v.conta ? '' : ' conf');
      var selo = cap ? (v.adotado ? ' <span class="selo calc">adotado</span>' : '') : (v.ambiente && !v.adotado ? ' <span class="selo norma" title="maior carga do ambiente">máx. carga</span>' : '');
      return '<td class="' + cls + '">' + f.num(cap ? v.capW : v.totalW, 0) + ' <small class="hora">' + (cap ? v.horaCap : v.horaTotal) + ' h</small>' + selo + '</td>';
    }
    var corpo = meses.map(function (mm) {
      return '<tr><td>' + mm.nomeMes + '</td>' + M.DIAS.map(function (dia) { return cel(mm.dias[dia], false) + cel(mm.dias[dia], true); }).join('') + '</tr>';
    }).join('');
    return '<div class="tabela-rolo"><table class="varr"><thead>' + cab1 + '</tr>' + cab2 + '</tr></thead><tbody>' + corpo + '</tbody></table></div>';
  }
  // Meses de um ambiente (M.calcular) no mesmo formato de resumo.meses
  function mesesDoAmbiente(r, projeto) {
    var dc = M.diasConsiderados(projeto), lista = [], n;
    for (n = 1; n <= 12; n++) {
      var dias = {};
      M.DIAS.forEach(function (dia) {
        var x = r.meses[n][dia];
        dias[dia] = { conta: dc.indexOf(dia) >= 0, totalW: x.totalPico, horaTotal: x.horaPico, capW: x.capPico, horaCap: x.horaCap,
          adotado: n === r.adotado.mes && dia === r.adotado.dia, ambiente: n === r.ambiente.mes && dia === r.ambiente.dia };
      });
      lista.push({ mes: n, nomeMes: mes(n), dias: dias });
    }
    return lista;
  }
  function avisoFragil(rs) {
    if (!rs.fragil) return '';
    return '<div class="aviso" style="margin:10px 0 0">Mês de pico frágil: ' + rs.fragil.nomeMes + ' fica a ' + f.num(rs.fragil.difW, 0) + ' W (' + f.num(rs.fragil.difPct, 2) + ' %) de ' + mes(rs.mes) +
      '. O valor é firme; o mês e a hora podem trocar com pequena variação do clima.</div>';
  }

  function pesos(E, cj, comp, total) {
    var maior = null, dono = '';
    cj.ambSis.forEach(function (r, j) {
      M.itensNoPico(r).forEach(function (x) { if (!maior || x.total > maior.total) { maior = x; dono = E.ambientes[j].nome; } });
    });
    var por = {}; comp.forEach(function (c) { por[c.id] = c.valor; });
    var env = por.opaca + por.vidroCond + por.vidroSolar, int = por.pessoasSens + por.pessoasLat + por.iluminacao + por.equipamentos;
    var ar = por.arExtSens + por.arExtLat + por.infSens + por.infLat;
    var s = '<div class="pesos">';
    s += '<div class="peso"><b class="num">' + f.num(env / total * 100, 0) + ' %</b>da carga do ambiente entra pela envoltória.' + (maior ? ' O elemento que mais pesa é “' + esc(maior.item.nome) + '”' +
      (E.ambientes.length > 1 ? ' de “' + esc(dono) + '”' : '') + ', com ' + f.num(maior.total, 0) + ' W' +
      (maior.solar > 0 ? ', dos quais ' + f.num(maior.solar, 0) + ' W de radiação solar (' + esc((maior.item.sombreamento || 'sem sombreamento').toLowerCase()) + ')' : '') + '.' : '') + '</div>';
    s += '<div class="peso"><b class="num">' + f.num(int / total * 100, 0) + ' %</b>vem de dentro: pessoas, iluminação e equipamentos. Equipamentos somam ' + f.num(por.equipamentos, 0) + ' W na hora do pico.</div>';
    s += '<div class="peso"><b class="num">' + f.num(ar / total * 100, 0) + ' %</b>vem do ar exterior e da infiltração (' + f.num(por.arExtSens + por.infSens, 0) + ' W sensível e ' + f.num(por.arExtLat + por.infLat, 0) + ' W latente). ' +
      'Dia adotado: ' + cj.nomeDia + '.</div>';
    return s + '</div>';
  }

  // Avisos do núcleo (M.avisos) com o número de campos substituídos na última importação, que só a tela conhece
  function avisosDe(E, cj) {
    var im = H.ui.U && H.ui.U.importacao;
    return M.avisos(E, cj, { importacao: im ? M.formato.contar(im.relatorio, 'substituido') : 0 });
  }

  function pendencias(E, cj) {
    var itens = [], nPadrao = 0;
    E.ambientes.forEach(function (amb) {
      if (amb.pessoas.n === null) nPadrao++;
      if (amb.ilum.dpi === null) nPadrao++;
      if (amb.ar.fp === null) nPadrao++;
      if (amb.ar.fa === null) nPadrao++;
    });
    if (!E.projeto.responsavel) itens.push(['!', 'Falta o responsável técnico. <a href="#/projeto">Preencher no passo Projeto</a>']);
    if (nPadrao) itens.push(['i', nPadrao + (nPadrao === 1 ? ' valor está' : ' valores estão') + ' no padrão da norma. Confirme se valem para este projeto; o memorial indica quais são.']);
    E.ambientes.forEach(function (amb, i) {
      M.envoltoria(amb).avisos.forEach(function (av) {
        itens.push(['!', esc(amb.nome) + ': ' + esc(av.texto) + ' <a href="#/ambiente/' + i + '?bloco=env&face=' + av.face + '">Abrir a face</a>']);
      });
    });
    avisosDe(E, cj).forEach(function (av) {
      itens.push([av.nivel === 'aviso' ? '!' : 'i', esc(av.texto) + (av.rota ? ' <a href="' + av.rota + '">Abrir</a>' : '')]);
    });
    itens.push(['!', 'A capacidade do sistema não inclui o calor dos ventiladores, o ganho de calor nos dutos nem o calor das bombas (ABNT NBR 16401-1:2024 6.3.2 e 6.4.2): acrescente-os na seleção dos equipamentos.']);
    itens.push(['!', esc(T.DEMO_ENV)]);
    return '<ul class="pend">' + itens.map(function (x) { return '<li><span class="selo ' + (x[0] === '!' ? 'alterado' : 'norma') + '" aria-hidden="true">' + x[0] + '</span><span>' + x[1] + '</span></li>'; }).join('') + '</ul>';
  }

  // Quadro "Do ambiente ao sistema": uma linha por parcela, cada número abre a conta
  function quadroPonte(rs, projeto) {
    var pt = rs.ponte, am = rs.ambiente, fs = projeto.fs / 100;
    var outra = am.mes !== rs.mes || am.dia !== rs.dia || am.hora !== rs.hora;
    return '<div class="tabela-rolo"><table class="ponte"><tbody>' +
      '<tr><td>Carga do ambiente às ' + rs.hora + ' h <span class="fraco">(soma dos ambientes)</span></td><td class="num">' + numBtn('total', f.num(pt.cargaAmbHora, 0) + ' W') + '</td></tr>' +
      '<tr><td>+ Calor da iluminação ao retorno</td><td class="num">' + numBtn('capacidade', f.num(pt.retornoHora, 0) + ' W') + '</td></tr>' +
      '<tr><td>+ Acréscimo de ar exterior do sistema <span class="fraco">(Ev = ' + H.motor.passos.evTxt(rs.sistema.ev) + ')</span></td><td class="num">' + numBtn('sistema', f.num(pt.acrescimo, 0) + ' W') + '</td></tr>' +
      '<tr class="total"><td>= Capacidade do sistema</td><td class="num">' + numBtn('sistema', '<b>' + f.num(rs.capSistemaW, 0) + ' W</b>') + '</td></tr>' +
      '<tr><td>× (1 + FS), FS = ' + f.num(projeto.fs, 1) + ' %</td><td class="num">× ' + f.num(1 + fs, 2) + '</td></tr>' +
      '<tr class="total"><td>= Capacidade de projeto</td><td class="num">' + numBtn('capacidade', '<b>' + f.num(rs.capProjetoW, 0) + ' W · ' + f.num(rs.capTR, 3) + ' TR</b>') + '</td></tr>' +
      '</tbody></table></div>' +
      (outra ? '<p class="fraco" style="margin-top:8px">A maior carga do ambiente no ano é ' + f.num(am.totalW, 0) + ' W (' + mes(am.mes) + ', dia de ' + am.nomeDia + ', ' + am.hora + ' h); a capacidade do sistema é dimensionada na combinação acima.</p>' : '');
  }

  // Linhas "Por ambiente" (Resultados e memorial): cada ambiente na sua combinação adotada e o conjunto na do sistema
  function tabelaPorAmbiente(E, cj, rs) {
    var linhas = E.ambientes.map(function (amb, i) {
      var ra = M.resumoAmbiente(cj.ambientes[i], E.projeto);
      return '<tr class="clicavel" data-acao="ir" data-rota="#/ambiente/' + i + '"><td>' + esc(amb.nome) + '</td><td class="num">' + f.num(amb.area, 0) + '</td><td class="num">' + mes(ra.mes) + ' · ' + DIA_CURTO[ra.dia] + ' · ' + ra.hora + ' h</td>' +
        '<td class="num">' + f.num(ra.capW - ra.retornoW, 0) + '</td><td class="num">' + f.num(ra.retornoW, 0) + '</td><td class="num">' + f.num(ra.capW, 0) + '</td><td class="num">' + f.num(ra.capTR, 2) + '</td><td class="num">' + f.num(ra.wm2, 0) + '</td></tr>';
    }).join('');
    var pt = rs.ponte;
    return '<div class="tabela-rolo"><table><thead><tr><th>Ambiente</th><th class="num">Área (m²)</th><th class="num">Combinação</th><th class="num">Carga do ambiente (W)</th><th class="num">Retorno (W)</th><th class="num">Capacidade (W)</th><th class="num">TR (com FS)</th><th class="num">W/m²</th></tr></thead><tbody>' +
      linhas + '<tr><td>Acréscimo de ar exterior do sistema (Ev = ' + H.motor.passos.evTxt(rs.sistema.ev) + ')</td><td></td><td></td><td></td><td></td><td class="num">' + f.num(pt.acrescimo, 0) + '</td><td></td><td></td></tr>' +
      '<tr class="total"><td>Conjunto (capacidade do sistema)</td><td class="num">' + f.num(cj.area, 0) + '</td><td class="num">' + mes(rs.mes) + ' · ' + DIA_CURTO[rs.dia] + ' · ' + rs.hora + ' h</td><td class="num">' + f.num(pt.cargaAmbHora, 0) + '</td><td class="num">' + f.num(pt.retornoHora, 0) +
      '</td><td class="num">' + f.num(rs.capSistemaW, 0) + '</td><td class="num">' + f.num(rs.capTR, 2) + '</td><td class="num">' + f.num(rs.wm2, 0) + '</td></tr></tbody></table></div>' +
      '<p class="fraco" style="margin-top:8px">Cada ambiente na sua própria combinação de mês, dia e hora; o conjunto, na do sistema. Soma dos máximos do ano de cada ambiente: ' + f.num(cj.somaPicos, 0) + ' W · soma das cargas dos ambientes na combinação adotada: ' + f.num(cj.somaCombinacao, 0) + ' W · pico simultâneo: ' + f.num(cj.totalPico, 0) + ' W · fator de diversidade (pico simultâneo ÷ soma na combinação adotada): ' + f.num(cj.diversidade, 2) +
      '. TR e W/m² incluem o fator de segurança de ' + f.num(E.projeto.fs, 0) + ' %.</p>' + tabelaSensivelAmbiente(E, cj);
  }

  /* Calor sensível de cada ambiente, sem ar exterior (o número gravado no bloco resultados do arquivo, formato 3), na combinação em que ocorre.
     Duas linhas no fim (v0.5.2, sessão C3; sempre, também com um ambiente só): a soma dos máximos e o simultâneo do conjunto (carga.js, conjunto) */
  function tabelaSensivelAmbiente(E, cj) {
    var sc = cj.sensivelAmbienteSimultaneo;
    return '<div class="tabela-rolo" style="margin-top:14px"><table><thead><tr><th>Ambiente</th><th class="num">Calor sensível do ambiente (W)</th><th class="num">Combinação</th></tr></thead><tbody>' +
      E.ambientes.map(function (amb, i) {
        var ra = M.resumoAmbiente(cj.ambientes[i], E.projeto);
        return '<tr><td>' + esc(amb.nome) + '</td><td class="num">' + f.num(ra.sensAmbW, 0) + '</td><td class="num">' + mes(ra.mesSens) + ' · ' + DIA_CURTO[ra.diaSens] + ' · ' + ra.horaSens + ' h</td></tr>';
      }).join('') +
      '<tr><td>Soma dos máximos de cada ambiente</td><td class="num">' + f.num(cj.somaSensivelAmbiente, 0) + '</td><td class="num">cada um na sua</td></tr>' +
      '<tr class="total"><td>Simultâneo do conjunto</td><td class="num">' + f.num(sc.valor, 0) + '</td><td class="num">' + mes(sc.mes) + ' · ' + DIA_CURTO[sc.dia] + ' · ' + sc.hora + ' h</td></tr>' +
      '</tbody></table></div>' +
      '<p class="fraco" style="margin-top:8px">Calor sensível do ambiente: sem ar exterior, sem latente, sem calor ao retorno e sem fator de segurança; maior valor do ano no horário de funcionamento. É o número gravado no arquivo para a seleção de difusores. ' +
      'O simultâneo é o maior valor da soma hora a hora de todos os ambientes do projeto numa mesma combinação de mês e dia de projeto, no horário de funcionamento; nunca passa da soma dos máximos. ' +
      'Como o valor de cada ambiente, não inclui ar exterior nem calor ao retorno: não é a carga sensível da serpentina.</p>';
  }

  var kpiMes = C.kpi, tabPassos = C.tabPassos;   // componentes comuns (plataforma)

  function resultados(E) {
    var cj = M.conjunto(E), comp = composicao(cj, E.projeto), rs = M.resumo(cj, E.projeto), am = rs.ambiente, sm = cj.sensivelMaximo;
    var hero = '<div class="cartao"><div class="heroi-res"><div><div class="fraco">Capacidade de projeto</div>' +
        '<button type="button" class="numero num" style="background:none;border:0;padding:0;color:inherit" data-acao="conta" data-chave="capacidade">' + f.num(rs.capTR, 2) + ' <small>TR</small></button>' +
        '<div class="suave num">' + f.num(rs.capProjetoW, 0) + ' W · ' + f.num(rs.capProjetoW * BTU_POR_W, 0) + ' BTU/h</div>' +
        '<div class="suave">' + mes(rs.mes) + ' · dia de ' + rs.nomeDia + ' · ' + rs.hora + ' h</div></div>' +
        '<div class="kpis">' +
          kpiMes('Carga do ambiente (máximo do ano)', f.num(am.totalW, 0) + ' W', mes(am.mes) + ', dia de ' + am.nomeDia + ', ' + am.hora + ' h') +
          kpiMes('Sensível e latente líquido, nessa hora', f.num(am.sensW, 0) + ' W · ' + f.num(am.latW, 0) + ' W') +
          kpiMes('Fator de calor sensível do ambiente', f.num(am.fcs, 2)) +
          kpiMes('Sensível máximo', f.num(sm.valor, 0) + ' W', mes(sm.mes) + ', dia de ' + sm.nomeDia + ', ' + sm.hora + ' h') +
          kpiMes('Densidade (sobre a capacidade de projeto)', f.num(rs.wm2, 0) + ' W/m²') +
          (rs.segunda ? kpiMes('Segunda maior hora da capacidade', rs.segunda.hora + ' h, ' + f.num(rs.segunda.capW, 0) + ' W', f.num(rs.segunda.difW, 0) + ' W abaixo do pico') : '') +
        '</div></div></div>';
    return T.cabeca('Passo 3 de 4', 'Resultados', 'Clique em qualquer número para ver a conta, com fórmula, valores e fonte.') +
      C.aprender('A capacidade de projeto parte da carga do ambiente, soma o calor da iluminação que vai ao retorno e o acréscimo de ar exterior do sistema (capacidade do sistema) e acrescenta o fator de segurança. A carga soma o calor sensível (temperatura) e o latente (umidade).') +
      hero +
      '<div class="cartao"><h2>Do ambiente ao sistema</h2><p class="suave" style="margin-bottom:10px">' + mes(rs.mes) + ', dia de ' + rs.nomeDia + ', ' + rs.hora + ' h: a combinação de maior capacidade do sistema entre os 12 meses.</p>' + quadroPonte(rs, E.projeto) + '</div>' +

  // ---------------------------------------------------------------- Memorial
  // Quadro das condições externas dos 12 meses (marca CONFERIR: dados mensais da ASHRAE 2021 a conferir com a folha oficial)
  function quadroMeses(p, mesAdotado) {
    var linhas = '', n, x;
    for (n = 1; n <= 12; n++) {
      x = M.contexto(p, n);
      linhas += '<tr' + (n === mesAdotado ? ' class="total"' : '') + '><td>' + mes(n) + (n === mesAdotado ? ' (adotado)' : '') + '</td><td class="num">' + f.num(x.dias.tbs.tbs, 1) + ' / ' + f.num(x.dias.tbs.tbu, 1) + ' °C</td><td class="num">' +
        f.num(x.dias.tbu.tbs, 1) + ' / ' + f.num(x.dias.tbu.tbu, 1) + ' °C</td><td class="num">' + f.num(x.dias.tbs.dTbs, 1) + ' °C</td><td class="num">' + f.num(x.tauB, 3) + '</td><td class="num">' + f.num(x.tauD, 3) + '</td></tr>';
    }
    return '<table><thead><tr><th>Mês</th><th class="num">Dia de tbs máxima (tbs / tbu coincidente)</th><th class="num">Dia de tbu máxima (tbu / tbs coincidente)</th><th class="num">Variação diária</th><th class="num">τb</th><th class="num">τd</th></tr></thead><tbody>' + linhas + '</tbody></table>' +
      '<p class="nota"><b>CONFERIR.</b> Valor anual da NBR 16401-1:2024 no mês do máximo de cada variável; os outros meses descem pela diferença mensal da ASHRAE Climatic Design Conditions 2021 (estação 833780). O dia de umidade máxima é o anual da NBR em todos os meses. ' +
      'Fonte da linha do mês adotado: ' + esc(H.dados.motor.climaMensal[mesAdotado - 1].fonte) + '.</p>';
  }

  // Séries CTS usadas pelos elementos do ambiente: id, descrição e fonte, 24 fatores em %, soma
  function tabelaCts(r) {
    var ids = [], dm = H.dados.motor;
    r.env.itens.forEach(function (it) { if (ids.indexOf(it.ctsId) < 0) ids.push(it.ctsId); });
    if (!ids.length) return '';
    var linhas = ids.map(function (id) {
      var c = dm.cts[id];
      if (!c) return '<tr><td>' + esc(id) + '</td><td colspan="3">série não encontrada</td></tr>';
      var soma = 0; c.c.forEach(function (v) { soma += v; });
      return '<tr><td>' + esc(id) + '</td><td>' + esc(c.descricao) + '<br><span class="fraco">' + esc(c.fonte) + '</span></td><td class="f">' + c.c.map(function (v) { return f.num(v * 100, 1); }).join('; ') + '</td><td class="num">' + f.num(soma * 100, 1) + ' %</td></tr>';
    }).join('');
    return '<table><thead><tr><th>Série</th><th>Descrição e fonte</th><th>Fatores (%), n = 0 a 23</th><th class="num">Soma</th></tr></thead><tbody>' + linhas + '</tbody></table>' +
      '<p class="nota">Fatores como impressos no ASHRAE Handbook Fundamentals 2021 (SI), cap. 18, Tabelas 16 e 17, conferidos com o texto do Handbook em 06/10/2026. A soma dos fatores impressos varia de 99,7 a 100,5 % por arredondamento do próprio Handbook; o cálculo usa os fatores como impressos.</p>';
  }

  function memorial(E) {
    var cj = M.conjunto(E), p = E.projeto, hoje = new Date(), clima = T.climaDe(p), rs = M.resumo(cj, p), sis = rs.sistema, am = rs.ambiente, pt = rs.ponte;

    }).filter(function (x) { return x; });
    var s = '<div class="cab-f"><div><h1>Memorial de cálculo de carga térmica de resfriamento</h1><div>' + esc(p.nome || 'Projeto sem nome') + (p.cliente ? ' · ' + esc(p.cliente) : '') + '</div></div>' +

        vidros.map(function (v) {
          var vd = H.dados.motor.vidrosPor[v.composicao], t = vd ? H.dados.motor.iacPor[vd.id + '|' + v.sombreamento] : null;
          return '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento interno</td><td class="num">' + esc(v.sombreamento || 'Sem sombreamento interno') + '</td><td>' + esc(v.composicao) + ': IAC0 ' + f.num(v.iac0, 2) + ' · IAC60 ' + f.num(v.iac60, 2) + ' · IACdif ' + f.num(v.iacDif, 2) + ' · FR ' + f.num(v.fracRad, 2) +
            ' (' + (t ? esc(t.fonte) : v.iacFab !== null ? 'IAC e FR informados pelo projetista (fabricante)' : 'sem crédito: IAC = 1, FR do vidro') + ')</td></tr>' +
            // sombreamento externo (beiral, brise, lâminas): só aparece no vidro que tem a proteção
            (v.ext && v.ext.ativa ? '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento externo</td><td class="num">' + esc(M.sombraExterna.descrever(v.ext, v.face)) +
              '</td><td>informado pelo projetista; fração ensolarada hora a hora sobre a radiação direta (ASHRAE Fundamentals 2021 cap. 15, Eq. (33) a (36)); a difusa entra inteira</td></tr>' : '') +
            (v.ext && v.ext.incompleto.length ? '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento externo</td><td class="num">incompleto</td><td>proteção escolhida sem a projeção ou sem a medida do vidro: calculado sem essa sombra</td></tr>' : '');
        }).join('') +
        '<tr><td>Ar exterior: Fp, Fa, D e Ez</td><td class="num">' + f.num(a.fp, 1) + ' L/s por pessoa · ' + f.num(a.fa, 1) + ' L/s por m² · D ' + f.num(a.d, 2) + ' · Ez ' + f.num(a.ez, 2) + '</td><td>' + estado(amb.ar.fp !== null || amb.ar.fa !== null || amb.ar.d != null || amb.ar.ez != null) + '</td></tr>' +
        '<tr><td>Infiltração</td><td class="num">' + f.num(a.infRenH, 2) + ' ren/h · ' + f.num(a.infLs, 1) + ' L/s</td><td>informado pelo projetista (padrão 0); em ar padrão</td></tr>' +
        '</tbody></table>' +
        h3(n + '.0 Varredura do ambiente') + tabelaVarredura(mesesDoAmbiente(r, p), 'Capacidade do ambiente') +
        h3(n + '.0 Dias de projeto, em ' + mes(ra.mes) + ', mês adotado') + T.tabelaDias(r);
      [['envoltoria', 'Envoltória'], ['pessoasSens', 'Pessoas: calor sensível'], ['pessoasLat', 'Pessoas: calor latente'], ['iluminacao', 'Iluminação'],
       ['equipamentos', 'Equipamentos'], ['arExtSens', 'Ar exterior: calor sensível'], ['arExtLat', 'Ar exterior: calor latente'], ['infSens', 'Infiltração: calor sensível'], ['infLat', 'Infiltração: calor latente'], ['total', 'Carga do ambiente'], ['capacidade', 'Capacidade']]
        .forEach(function (c, j) {
          s += h3(n + '.' + (j + 1) + ' ' + c[1]) + tabPassos(M.passos(c[0], amb, r, p));
        });
      s += h3(n + '.12 Séries CTS dos elementos') + tabelaCts(r);
    });

    s += '<h2>' + (E.ambientes.length + 4) + '. Sistema de ar e capacidade do conjunto</h2>' + tabPassos(M.passos('capacidade', null, cj, p));
    var nf = E.ambientes.length + 5;
    s += '<h2>' + nf + '. Perfil horário do conjunto</h2><p class="nota">Combinação adotada: ' + mes(rs.mes) + ', dia de ' + rs.nomeDia + '.</p>' + tabelaHoraria(cj, rs) +
      '<h2>' + (nf + 1) + '. Limites deste documento</h2><p>' + esc(T.DEMO_ENV) + '</p>' +
      '<ul>' + avisosDe(E, cj).map(function (av) { return '<li>' + esc(av.texto) + '</li>'; }).join('') + '</ul>';

    return '<div class="nao-imprime">' + T.cabeca('Passo 4 de 4', 'Memorial', 'É este o documento que sai em PDF. Ele é montado a partir do que está nas telas, sem redigitação.') +
      '<div class="acoes" style="margin-bottom:16px"><button class="botao prim" data-acao="pdf">Gerar PDF</button><button class="botao" data-acao="salvar">Salvar arquivo do projeto</button>' +
      '<span class="fraco">No diálogo de impressão, escolha “Salvar como PDF”.</span></div></div>' +
      '<article class="folha">' + s + '</article>';
  }

  H.ui.telas.resultados = resultados;
  H.ui.telas.memorial = memorial;
  H.ui.telas.composicao = composicao;
})(window.HVAC);

</script>
<script>
/* ==== js/interface/app.js ==== */
/* Manifesto da carga térmica para a casca comum (_plataforma-hvac, casca.js; contrato em docs\GUIA_INTERFACE.md de lá).
   Aqui fica só o que é deste app: rotas e trilha, faixa de resultado, a conta de cada número, comandos, limites dos campos,
   ações de ambiente, face, equipamento e sombreamento, e a leitura do gráfico de 24 h. Estado, armazenamento, arquivo,
   gaveta, paleta, tema e eventos são da casca. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, T = H.ui.telas, K = H.ui.api, U = H.ui.U;
  function proj() { return K.projeto(); }      // projeto aberto (o mesmo objeto que a casca guarda)

  var NOME_DIA_CURTO = { tbs: 'tbs máx.', tbu: 'tbu máx.', umi: 'umidade máx.' };

  var TITULOS = { pessoasSens: 'Pessoas: calor sensível', pessoasLat: 'Pessoas: calor latente', iluminacao: 'Iluminação', equipamentos: 'Equipamentos',
                  arExtSens: 'Ar exterior: calor sensível', arExtLat: 'Ar exterior: calor latente', infSens: 'Infiltração: calor sensível', infLat: 'Infiltração: calor latente', opaca: 'Envoltória opaca: condução',
                  vidroCond: 'Vidros: condução', vidroSolar: 'Vidros: radiação solar', envoltoria: 'Envoltória', total: 'Carga do ambiente', capacidade: 'Capacidade de projeto', sistema: 'Capacidade do sistema' };

  // No editor de ambiente a conta é a do ambiente; em Resultados é a do conjunto, na hora do pico simultâneo
  function conta(chave, E) {
    var cj = H.motor.conjunto(E), html = '', valor = 0, hora;
    if (!TITULOS[chave]) return null;
    if (U.tela === 'ambiente' && E.ambientes[U.amb]) {
      var r = cj.ambientes[U.amb];
      hora = r.horaPico;
      html = C.passos(H.motor.passos(chave, E.ambientes[U.amb], r, E.projeto));
      if (chave === 'capacidade') { var ra = H.motor.resumoAmbiente(r, E.projeto); valor = ra.capProjetoW; hora = ra.hora; }
      else valor = chave === 'total' ? r.totalPico : chave === 'envoltoria' ? r.envoltoria : r.pico[chave];
    } else {
      hora = cj.adotado.hora;
      if (chave === 'sistema') { var rs0 = H.motor.resumo(cj, E.projeto); html = C.passos(H.motor.passos('sistema', null, cj, E.projeto)); valor = rs0.capSistemaW; }
      else if (chave === 'capacidade') { var rs = H.motor.resumo(cj, E.projeto); html = C.passos(H.motor.passos(chave, null, cj, E.projeto)); valor = rs.capProjetoW; hora = rs.hora; }
      else {
        E.ambientes.forEach(function (amb, i) {
          var r2 = cj.ambSis[i];
          valor += chave === 'total' ? r2.totalPico : chave === 'envoltoria' ? r2.envoltoria : r2.pico[chave];
          html += (E.ambientes.length > 1 ? '<h3 style="margin:14px 0 8px">' + esc(amb.nome) + '</h3>' : '') + C.passos(H.motor.passos(chave, amb, r2, E.projeto));
        });
      }
    }
    return { sobre: 'Como foi calculado · ' + hora + ' h', titulo: TITULOS[chave],
             valor: chave === 'capacidade' ? f.num(valor / H.dados.W_POR_TR, 3) + ' TR' : f.num(valor, 0) + ' W', html: html };
  }

  function duplicar(i) {
    var E = proj(), copia = JSON.parse(JSON.stringify(E.ambientes[i]));
    copia.nome = copia.nome + ' (cópia)';
    E.ambientes.splice(i + 1, 0, copia);
    K.guardar();
    location.hash = '#/ambiente/' + (i + 1);
  }

  // Mantém a face coerente: trocar o que há do outro lado troca a lista de composições; trocar a composição zera o U manual
  function ajustarFace(caminho, E) {
    var ps = caminho.split('.'), face = ps[3], campo = ps[4], fc = E.ambientes[+ps[1]].faces[face];
    if (campo === 'cond' && fc.cond !== 'interna') {
      var cat = T.categoriaDaFace(face, fc.cond);
      var lista = H.dados.tab.composicoes.filter(function (c) { return c.categoria === cat; });
      if (!lista.some(function (c) { return c.nome === fc.comp; })) { fc.comp = lista.length ? lista[0].nome : ''; fc.u = null; }
      if (fc.cond === 'externa' && !fc.cor) fc.cor = face === 'C' ? 'Escura' : 'Clara';
      if (fc.cond === 'externa' && !fc.somb) fc.somb = 'Sem sombreamento interno';
    }
    if (campo === 'comp') fc.u = null;
  }

  H.app = {
    id: 'carga-termica',
    nome: 'Carga térmica',
    rotuloVersao: 'protótipo v' + H.versao,
    chave: 'hvac.carga-termica.v1',
    paletaDica: 'Digite um comando ou o nome de um ambiente',
    estado: { amb: 0, aberto: { env: true }, face: 'O', tabela: false },

    rotas: {
      inicio: { tela: function (E) { return T.inicio(E); } },
      projeto: { tela: function (E) { return T.projeto(E); }, faixa: true },
      ambientes: { tela: function (E) { return T.ambientes(E); }, faixa: true },
      ambiente: { tela: function (E, U) { return T.ambiente(E, U.amb); }, indice: 'amb', passo: 'ambientes', faixa: true },
      resultados: { tela: function (E) { return T.resultados(E); }, larga: true },
      memorial: { tela: function (E) { return T.memorial(E); }, larga: true, imprime: true }
    },
    parametros: {
      visao: function (v, U) { U.tabela = v === 'tabela'; },
      face: function (v, U) { U.face = v; }
    },

    trilha: [
      { r: 'projeto', t: 'Projeto', s: function (E) { return E.projeto.responsavel ? 'Brasília' : 'falta o responsável'; }, pend: function (E) { return !E.projeto.responsavel; } },
      { r: 'ambientes', t: 'Ambientes', s: function (E) { return E.ambientes.length + (E.ambientes.length === 1 ? ' ambiente' : ' ambientes'); } },
      { r: 'resultados', t: 'Resultados', s: function (E, R) { return f.num(R.rs.capTR, 2) + ' TR'; } },
      { r: 'memorial', t: 'Memorial', s: function (E) { return 'revisão ' + E.projeto.revisao; } }
    ],

    calcular: function (E) { var cj = H.motor.conjunto(E); return { cj: cj, rs: H.motor.resumo(cj, E.projeto) }; },
    medida: function (E) { return H.motor.conjunto(E).adotado.cap; },     // a faixa mostra a variação da capacidade

    faixa: function (E, R, U) {
      var rs = R.rs, d = Math.round(U.delta);
      return {
        itens: [
          { rotulo: 'Carga do ambiente', valor: f.num(rs.ambiente.totalW, 0) + ' W' },
          { rotulo: 'Capacidade de projeto', valor: f.num(rs.capTR, 2) + ' TR' },
          { rotulo: 'Densidade', valor: f.num(rs.wm2, 0) + ' W/m²', sec: true },
          { rotulo: 'Pico da capacidade', valor: H.motor.MESES[rs.mes - 1] + ' · ' + NOME_DIA_CURTO[rs.dia] + ' · ' + rs.hora + ' h', sec: true }
        ],
        delta: d ? (d > 0 ? '▲ +' : '▼ ') + f.num(d, 0) + ' W de capacidade com a última alteração' : '',
        link: { href: '#/resultados', texto: 'Ver resultados' }
      };
    },

    conta: conta,

    arquivo: {
      formato: H.motor.formato.FORMATO,
      versao: H.motor.formato.VERSAO_FORMATO,
      abrir: function (obj) { return H.motor.formato.abrir(obj); },                       // converte a versão 1, valida e devolve o relatório
      textoRelatorio: function (r, nome) { return H.motor.formato.texto(r, nome); },
      exemplo: function () { return H.dados.exemplo.projeto(); },
      // bloco resultados do arquivo salvo (formato 3): o calor sensível de cada ambiente; R é o calcular(E) feito pela casca na hora de salvar
      aoSalvar: function (E, R) { return { resultados: H.motor.formato.resultados(E, R.cj) }; }
    },

    comandos: function (E, U) {
      var lista = [];
      E.ambientes.forEach(function (amb, i) { lista.push({ t: 'Abrir ambiente: ' + amb.nome, fn: function () { location.hash = '#/ambiente/' + i; } }); });
      lista.push({ t: 'Novo ambiente a partir de modelo', fn: function () { K.janela(T.janelaModelos()); } });
      if (U.tela === 'ambiente') lista.push({ t: 'Duplicar o ambiente aberto', k: 'Ctrl D', fn: function () { duplicar(U.amb); } });
      return lista;
    },
    atalhos: [
      { tecla: 'd', quando: function (U) { return U.tela === 'ambiente'; }, fn: function (E, U) { duplicar(U.amb); } }
    ],

    // Limites próprios dos campos (a casca já recusa vazio, texto e número negativo)
    validar: function (caminho, v) {
      if (/\.ar\.ez$/.test(caminho) && v <= 0) return 'Digite um número maior que zero (Ez entre 0,5 e 1,5, NBR 16401-3:2024, Tabela 3).';
      var lim = /(^|\.)tInt$/.test(caminho) ? [10, 35, 'Digite um número entre 10 e 35 °C.'] : /(^|\.)urInt$/.test(caminho) ? [20, 80, 'Digite um número entre 20 e 80 %.'] :
        /(^projeto\.dSistema|\.ar\.d)$/.test(caminho) ? [0, 1, 'Digite um número entre 0 e 1 (use vírgula para decimais).'] :
        /\.sombIac$/.test(caminho) ? [0.0000001, 1, 'Digite um número maior que 0 e até 1 (IAC do fabricante).'] : /\.sombFr$/.test(caminho) ? [0, 1, 'Digite um número entre 0 e 1 (FR do fabricante).'] :
        // Sombreamento externo do vidro (os mesmos limites de formato.js, sombExterno)
        /\.ext[HV](Proj|Folga)$/.test(caminho) ? [0, 10, 'Digite um número entre 0 e 10 m.'] : /\.ext(HAlt|VLarg)$/.test(caminho) ? [0.0000001, 20, 'Digite um número maior que 0 e até 20 m.'] : null;
      return lim && (v < lim[0] || v > lim[1]) ? lim[2] : '';
    },
    // Janela de ocupação: horas entre 1 e 24, com a final nunca antes da inicial
    ajustar: function (caminho, v, E) {
      if (caminho === 'projeto.hIni' || caminho === 'projeto.hFim') {
        v = Math.min(24, Math.max(1, v));
        if (caminho === 'projeto.hIni' && v > E.projeto.hFim) E.projeto.hFim = v;
        if (caminho === 'projeto.hFim' && v < E.projeto.hIni) v = E.projeto.hIni;
      }
      return v;
    },
    aoAlterar: function (caminho, E) { if (caminho.indexOf('.faces.') > 0) ajustarFace(caminho, E); },

    acoes: {
      face: function (el) { U.face = el.getAttribute('data-face'); },
      'visao-env': function (el) { U.tabela = el.getAttribute('data-valor') === 'tabela'; },
      definir: function (el) {
        var v = el.getAttribute('data-valor'), cam = el.getAttribute('data-caminho'), E = proj();
        if (v === 'potencia' && /\.ilum\.modo$/.test(cam)) {   // preserva a potência equivalente da DPI adotada ao trocar de modo
          var amb = E.ambientes[+cam.split('.')[1]];
          if (amb.ilum.potencia === null || amb.ilum.potencia === undefined) amb.ilum.potencia = H.motor.adotados(amb, E.projeto).ilumInstalada;
        }
        K.acoes.definir(el);
      },
      'add-equip': function () { var E = proj(); K.alterar('amb.' + U.amb + '.nome', function () { E.ambientes[U.amb].equip.push({ item: H.dados.tab.equipamentos[0].nome, qtd: 1, w: null, fu: null }); }); },
      'somb-tipo': function (el) {    // troca o tipo do sombreamento (cascata): grava o nome padrão do tipo; sair de "Valores do fabricante" zera IAC e FR
        var S = H.motor.formato.somb, tipo = el.getAttribute('data-valor');
        K.alterar(el.getAttribute('data-caminho'), function (t) {
          var antes = S.decompor(t.o[t.k]).tipo;
          t.o[t.k] = S.PADRAO_TIPO[tipo];
          if (antes === 'fabricante' && tipo !== 'fabricante') { t.o.sombIac = null; t.o.sombFr = null; }
        });
      },
      'somb-opc': function (el) {     // cor, posição ou trama: recompõe o nome da lista a partir do nome gravado
        var S = H.motor.formato.somb, campo = el.getAttribute('data-campo'), v = el.getAttribute('data-valor');
        K.alterar(el.getAttribute('data-caminho'), function (t) {
          var d = S.decompor(t.o[t.k]);
          if (campo === 'voil') d.voil = v === '1'; else d[campo] = v;
          t.o[t.k] = S.compor(d.tipo, d);
        });
      },
      'del-equip': function (el) { var E = proj(); K.alterar('amb.' + U.amb + '.nome', function () { E.ambientes[U.amb].equip.splice(+el.getAttribute('data-j'), 1); }); },
      'novo-amb': function () { K.janela(T.janelaModelos()); },
      'criar-amb': function (el) {
        var E = proj();
        E.ambientes.push(H.dados.exemplo.deModelo(el.getAttribute('data-recinto')));
        U.sobre = null; U.aberto = { geo: true }; K.guardar();
        location.hash = '#/ambiente/' + (E.ambientes.length - 1);
      },
      duplicar: function (el) { duplicar(+el.getAttribute('data-amb')); },
      excluir: function (el) {
        var E = proj(), i = +el.getAttribute('data-amb');
        if (E.ambientes.length > 1 && window.confirm('Excluir o ambiente “' + E.ambientes[i].nome + '”?')) { E.ambientes.splice(i, 1); U.delta = 0; K.guardar(); }
      }
    }
  };

  // Leitura do gráfico de 24 h: cursor e valores da hora sob o ponteiro
  document.addEventListener('mousemove', function (ev) {
    var caixa = document.getElementById('graf-caixa');
    if (!caixa) return;
    var dica = document.getElementById('graf-dica'), cursor = document.getElementById('graf-cursor');
    var r = caixa.getBoundingClientRect(), L = +caixa.getAttribute('data-l'), me = +caixa.getAttribute('data-me'), md = +caixa.getAttribute('data-md');
    var xs = (ev.clientX - r.left) / r.width * L;
    if (ev.clientY < r.top || ev.clientY > r.bottom || xs < me - 6 || xs > L - md + 6) { dica.className = 'dica oculto'; cursor.setAttribute('class', 'cursor oculto'); return; }
    var h = Math.min(24, Math.max(1, Math.round((xs - me) / (L - me - md) * 23) + 1)), cj = H.motor.conjunto(proj());
    var xh = me + (h - 1) / 23 * (L - me - md);
    cursor.setAttribute('x1', xh); cursor.setAttribute('x2', xh); cursor.setAttribute('class', 'cursor');
    dica.className = 'dica';
    dica.style.left = Math.min(Math.max(xh / L * r.width, 90), r.width - 90) + 'px';
    dica.style.top = '34px';
    dica.innerHTML = '<b>' + h + ' h</b> · capacidade ' + f.num(cj.sistema.series.cap[h - 1], 0) + ' W · carga do ambiente ' + f.num(cj.total[h - 1], 0) + ' W';
  });
})(window.HVAC);

</script>
<script>window.HVAC.ui.iniciar();</script>

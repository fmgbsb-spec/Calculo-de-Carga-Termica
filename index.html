        vidros.map(function (v) {
          var vd = H.dados.motor.vidrosPor[v.composicao], t = vd ? H.dados.motor.iacPor[vd.id + '|' + v.sombreamento] : null;
          return '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento interno</td><td class="num">' + esc(v.sombreamento || 'Sem sombreamento interno') + '</td><td>' + esc(v.composicao) + ': IAC0 ' + f.num(v.iac0, 2) + ' · IAC60 ' + f.num(v.iac60, 2) + ' · IACdif ' + f.num(v.iacDif, 2) + ' · FR ' + f.num(v.fracRad, 2) +
            ' (' + (t ? esc(t.fonte) : v.iacFab !== null ? 'IAC e FR informados pelo projetista (fabricante)' : 'sem crédito: IAC = 1, FR do vidro') + ')</td></tr>' +
            // sombreamento externo (beiral, brise, lâminas): só aparece no vidro que tem a proteção
            (v.ext && v.ext.ativa ? '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento externo</td><td class="num">' + esc(M.sombraExterna.descrever(v.ext, v.face)) +
              '</td><td>informado pelo projetista; fração ensolarada hora a hora sobre a radiação direta (ASHRAE Fundamentals 2021 cap. 15, Eq. (33) a (36)); a difusa entra inteira</td></tr>' : '') +
            (v.ext && v.ext.incompleto.length ? '<tr><td>Vidro ' + esc(M.FACES[v.face]) + ': sombreamento externo</td><td class="num">incompleto</td><td>proteção escolhida sem a projeção ou sem a medida do vidro: calculado sem essa sombra</td></tr>' : '');
        }).join('') +
        '<tr><td>Ar exterior: Fp, Fa, D e Ez</td><td class="num">' + f.num(a.fp, 1) + ' L/s por pessoa · ' + f.num(a.fa, 1) + ' L/s por m² · D ' + f.num(a.d, 2) + ' · Ez ' + f.num(a.ez, 2) + '</td><td>' + estado(amb.ar.fp !== null || amb.ar.fa !== null || amb.ar.d != null || amb.ar.ez != null) + '</td></tr>' +
        '<tr><td>Infiltração</td><td class="num">' + f.num(a.infRenH, 2) + ' ren/h · ' + f.num(a.infLs, 1) + ' L/s</td><td>informado pelo projetista (padrão 0); em ar padrão</td></tr>' +
        '</tbody></table>' +
        h3(n + '.0 Varredura do ambiente') + tabelaVarredura(mesesDoAmbiente(r, p), 'Capacidade do ambiente') +
        h3(n + '.0 Dias de projeto, em ' + mes(ra.mes) + ', mês adotado') + T.tabelaDias(r);
      [['envoltoria', 'Envoltória'], ['pessoasSens', 'Pessoas: calor sensível'], ['pessoasLat', 'Pessoas: calor latente'], ['iluminacao', 'Iluminação'],
       ['equipamentos', 'Equipamentos'], ['arExtSens', 'Ar exterior: calor sensível'], ['arExtLat', 'Ar exterior: calor latente'], ['infSens', 'Infiltração: calor sensível'], ['infLat', 'Infiltração: calor latente'], ['total', 'Carga do ambiente'], ['capacidade', 'Capacidade']]
        .forEach(function (c, j) {
          s += h3(n + '.' + (j + 1) + ' ' + c[1]) + tabPassos(M.passos(c[0], amb, r, p));
        });
      s += h3(n + '.12 Séries CTS dos elementos') + tabelaCts(r);
    });

    s += '<h2>' + (E.ambientes.length + 4) + '. Sistema de ar e capacidade do conjunto</h2>' + tabPassos(M.passos('capacidade', null, cj, p));
    var nf = E.ambientes.length + 5;
    s += '<h2>' + nf + '. Perfil horário do conjunto</h2><p class="nota">Combinação adotada: ' + mes(rs.mes) + ', dia de ' + rs.nomeDia + '.</p>' + tabelaHoraria(cj, rs) +
      '<h2>' + (nf + 1) + '. Limites deste documento</h2><p>' + esc(T.DEMO_ENV) + '</p>' +
      '<ul>' + avisosDe(E, cj).map(function (av) { return '<li>' + esc(av.texto) + '</li>'; }).join('') + '</ul>';

    return '<div class="nao-imprime">' + T.cabeca('Passo 4 de 4', 'Memorial', 'É este o documento que sai em PDF. Ele é montado a partir do que está nas telas, sem redigitação.') +
      '<div class="acoes" style="margin-bottom:16px"><button class="botao prim" data-acao="pdf">Gerar PDF</button><button class="botao" data-acao="salvar">Salvar arquivo do projeto</button>' +
      '<span class="fraco">No diálogo de impressão, escolha “Salvar como PDF”.</span></div></div>' +
      '<article class="folha">' + s + '</article>';
  }

  H.ui.telas.resultados = resultados;
  H.ui.telas.memorial = memorial;
  H.ui.telas.composicao = composicao;
})(window.HVAC);

</script>
<script>
/* ==== js/interface/app.js ==== */
/* Manifesto da carga térmica para a casca comum (_plataforma-hvac, casca.js; contrato em docs\GUIA_INTERFACE.md de lá).
   Aqui fica só o que é deste app: rotas e trilha, faixa de resultado, a conta de cada número, comandos, limites dos campos,
   ações de ambiente, face, equipamento e sombreamento, e a leitura do gráfico de 24 h. Estado, armazenamento, arquivo,
   gaveta, paleta, tema e eventos são da casca. */
(function (H) {
  'use strict';
  var f = H.util.fmt, esc = f.esc, C = H.ui.c, T = H.ui.telas, K = H.ui.api, U = H.ui.U;
  function proj() { return K.projeto(); }      // projeto aberto (o mesmo objeto que a casca guarda)

  var NOME_DIA_CURTO = { tbs: 'tbs máx.', tbu: 'tbu máx.', umi: 'umidade máx.' };

  var TITULOS = { pessoasSens: 'Pessoas: calor sensível', pessoasLat: 'Pessoas: calor latente', iluminacao: 'Iluminação', equipamentos: 'Equipamentos',
                  arExtSens: 'Ar exterior: calor sensível', arExtLat: 'Ar exterior: calor latente', infSens: 'Infiltração: calor sensível', infLat: 'Infiltração: calor latente', opaca: 'Envoltória opaca: condução',
                  vidroCond: 'Vidros: condução', vidroSolar: 'Vidros: radiação solar', envoltoria: 'Envoltória', total: 'Carga do ambiente', capacidade: 'Capacidade de projeto', sistema: 'Capacidade do sistema' };

  // No editor de ambiente a conta é a do ambiente; em Resultados é a do conjunto, na hora do pico simultâneo
  function conta(chave, E) {
    var cj = H.motor.conjunto(E), html = '', valor = 0, hora;
    if (!TITULOS[chave]) return null;
    if (U.tela === 'ambiente' && E.ambientes[U.amb]) {
      var r = cj.ambientes[U.amb];
      hora = r.horaPico;
      html = C.passos(H.motor.passos(chave, E.ambientes[U.amb], r, E.projeto));
      if (chave === 'capacidade') { var ra = H.motor.resumoAmbiente(r, E.projeto); valor = ra.capProjetoW; hora = ra.hora; }
      else valor = chave === 'total' ? r.totalPico : chave === 'envoltoria' ? r.envoltoria : r.pico[chave];
    } else {
      hora = cj.adotado.hora;
      if (chave === 'sistema') { var rs0 = H.motor.resumo(cj, E.projeto); html = C.passos(H.motor.passos('sistema', null, cj, E.projeto)); valor = rs0.capSistemaW; }
      else if (chave === 'capacidade') { var rs = H.motor.resumo(cj, E.projeto); html = C.passos(H.motor.passos(chave, null, cj, E.projeto)); valor = rs.capProjetoW; hora = rs.hora; }
      else {
        E.ambientes.forEach(function (amb, i) {
          var r2 = cj.ambSis[i];
          valor += chave === 'total' ? r2.totalPico : chave === 'envoltoria' ? r2.envoltoria : r2.pico[chave];
          html += (E.ambientes.length > 1 ? '<h3 style="margin:14px 0 8px">' + esc(amb.nome) + '</h3>' : '') + C.passos(H.motor.passos(chave, amb, r2, E.projeto));
        });
      }
    }
    return { sobre: 'Como foi calculado às ' + hora + ' h', titulo: TITULOS[chave],
             valor: chave === 'capacidade' ? f.num(valor / H.dados.W_POR_TR, 3) + ' TR' : f.num(valor, 0) + ' W', html: html };
  }

  function duplicar(i) {
    var E = proj(), copia = JSON.parse(JSON.stringify(E.ambientes[i]));
    copia.nome = copia.nome + ' (cópia)';
    E.ambientes.splice(i + 1, 0, copia);
    K.guardar();
    location.hash = '#/ambiente/' + (i + 1);
  }

  // Mantém a face coerente: trocar o que há do outro lado troca a lista de composições; trocar a composição zera o U manual
  function ajustarFace(caminho, E) {
    var ps = caminho.split('.'), face = ps[3], campo = ps[4], fc = E.ambientes[+ps[1]].faces[face];
    if (campo === 'cond' && fc.cond !== 'interna') {
      var cat = T.categoriaDaFace(face, fc.cond);
      var lista = H.dados.tab.composicoes.filter(function (c) { return c.categoria === cat; });
      if (!lista.some(function (c) { return c.nome === fc.comp; })) { fc.comp = lista.length ? lista[0].nome : ''; fc.u = null; }
      if (fc.cond === 'externa' && !fc.cor) fc.cor = face === 'C' ? 'Escura' : 'Clara';
      if (fc.cond === 'externa' && !fc.somb) fc.somb = 'Sem sombreamento interno';
    }
    if (campo === 'comp') fc.u = null;
  }

  H.app = {
    id: 'carga-termica',
    nome: 'Carga térmica',
    rotuloVersao: 'protótipo v' + H.versao,
    chave: 'hvac.carga-termica.v1',
    paletaDica: 'Digite um comando ou o nome de um ambiente',
    estado: { amb: 0, aberto: { env: true }, face: 'O', tabela: false },

    rotas: {
      inicio: { tela: function (E) { return T.inicio(E); } },
      projeto: { tela: function (E) { return T.projeto(E); }, faixa: true },
      ambientes: { tela: function (E) { return T.ambientes(E); }, faixa: true },
      ambiente: { tela: function (E, U) { return T.ambiente(E, U.amb); }, indice: 'amb', passo: 'ambientes', faixa: true },
      resultados: { tela: function (E) { return T.resultados(E); }, larga: true },
      memorial: { tela: function (E) { return T.memorial(E); }, larga: true, imprime: true }
    },
    parametros: {
      visao: function (v, U) { U.tabela = v === 'tabela'; },
      face: function (v, U) { U.face = v; }
    },

    trilha: [
      { r: 'projeto', t: 'Projeto', s: function (E) { return E.projeto.responsavel ? 'Brasília' : 'falta o responsável'; }, pend: function (E) { return !E.projeto.responsavel; } },
      { r: 'ambientes', t: 'Ambientes', s: function (E) { return E.ambientes.length + (E.ambientes.length === 1 ? ' ambiente' : ' ambientes'); } },
      { r: 'resultados', t: 'Resultados', s: function (E, R) { return f.num(R.rs.capTR, 2) + ' TR'; } },
      { r: 'memorial', t: 'Memorial', s: function (E) { return 'revisão ' + E.projeto.revisao; } }
    ],

    calcular: function (E) { var cj = H.motor.conjunto(E); return { cj: cj, rs: H.motor.resumo(cj, E.projeto) }; },
    medida: function (E) { return H.motor.conjunto(E).adotado.cap; },     // a faixa mostra a variação da capacidade

    faixa: function (E, R, U) {
      var rs = R.rs, d = Math.round(U.delta);
      return {
        itens: [
          { rotulo: 'Carga do ambiente', valor: f.num(rs.ambiente.totalW, 0) + ' W' },
          { rotulo: 'Capacidade de projeto', valor: f.num(rs.capTR, 2) + ' TR' },
          { rotulo: 'Densidade', valor: f.num(rs.wm2, 0) + ' W/m²', sec: true },
          { rotulo: 'Pico da capacidade', valor: H.motor.MESES[rs.mes - 1] + ' · ' + NOME_DIA_CURTO[rs.dia] + ' · ' + rs.hora + ' h', sec: true }
        ],
        delta: d ? (d > 0 ? '▲ +' : '▼ ') + f.num(d, 0) + ' W de capacidade com a última alteração' : '',
        link: { href: '#/resultados', texto: 'Ver resultados' }
      };
    },

    conta: conta,

    arquivo: {
      formato: H.motor.formato.FORMATO,
      versao: H.motor.formato.VERSAO_FORMATO,
      abrir: function (obj) { return H.motor.formato.abrir(obj); },                       // converte a versão 1, valida e devolve o relatório
      textoRelatorio: function (r, nome) { return H.motor.formato.texto(r, nome); },
      exemplo: function () { return H.dados.exemplo.projeto(); },
      // bloco resultados do arquivo salvo (formato 3): o calor sensível de cada ambiente; R é o calcular(E) feito pela casca na hora de salvar
      aoSalvar: function (E, R) { return { resultados: H.motor.formato.resultados(E, R.cj) }; }
    },

    comandos: function (E, U) {
      var lista = [];
      E.ambientes.forEach(function (amb, i) { lista.push({ t: 'Abrir ambiente: ' + amb.nome, fn: function () { location.hash = '#/ambiente/' + i; } }); });
      lista.push({ t: 'Criar ambiente a partir de modelo', fn: function () { K.janela(T.janelaModelos()); } });
      if (U.tela === 'ambiente') lista.push({ t: 'Duplicar o ambiente aberto', k: 'Ctrl D', fn: function () { duplicar(U.amb); } });
      return lista;
    },
    atalhos: [
      { tecla: 'd', quando: function (U) { return U.tela === 'ambiente'; }, fn: function (E, U) { duplicar(U.amb); } }
    ],

    // Limites próprios dos campos (a casca já recusa vazio, texto e número negativo)
    validar: function (caminho, v) {
      if (/\.ar\.ez$/.test(caminho) && v <= 0) return 'Digite um número maior que zero (Ez entre 0,5 e 1,5, NBR 16401-3:2024, Tabela 3).';
      var lim = /(^|\.)tInt$/.test(caminho) ? [10, 35, 'Digite um número entre 10 e 35 °C.'] : /(^|\.)urInt$/.test(caminho) ? [20, 80, 'Digite um número entre 20 e 80 %.'] :
        /(^projeto\.dSistema|\.ar\.d)$/.test(caminho) ? [0, 1, 'Digite um número entre 0 e 1 (use vírgula para decimais).'] :
        /\.sombIac$/.test(caminho) ? [0.0000001, 1, 'Digite um número maior que 0 e até 1 (IAC do fabricante).'] : /\.sombFr$/.test(caminho) ? [0, 1, 'Digite um número entre 0 e 1 (FR do fabricante).'] :
        // Sombreamento externo do vidro (os mesmos limites de formato.js, sombExterno)
        /\.ext[HV](Proj|Folga)$/.test(caminho) ? [0, 10, 'Digite um número entre 0 e 10 m.'] : /\.ext(HAlt|VLarg)$/.test(caminho) ? [0.0000001, 20, 'Digite um número maior que 0 e até 20 m.'] : null;
      return lim && (v < lim[0] || v > lim[1]) ? lim[2] : '';
    },
    // Janela de ocupação: horas entre 1 e 24, com a final nunca antes da inicial
    ajustar: function (caminho, v, E) {
      if (caminho === 'projeto.hIni' || caminho === 'projeto.hFim') {
        v = Math.min(24, Math.max(1, v));
        if (caminho === 'projeto.hIni' && v > E.projeto.hFim) E.projeto.hFim = v;
        if (caminho === 'projeto.hFim' && v < E.projeto.hIni) v = E.projeto.hIni;
      }
      return v;
    },
    aoAlterar: function (caminho, E) { if (caminho.indexOf('.faces.') > 0) ajustarFace(caminho, E); },

    acoes: {
      face: function (el) { U.face = el.getAttribute('data-face'); },
      'visao-env': function (el) { U.tabela = el.getAttribute('data-valor') === 'tabela'; },
      definir: function (el) {
        var v = el.getAttribute('data-valor'), cam = el.getAttribute('data-caminho'), E = proj();
        if (v === 'potencia' && /\.ilum\.modo$/.test(cam)) {   // preserva a potência equivalente da DPI adotada ao trocar de modo
          var amb = E.ambientes[+cam.split('.')[1]];
          if (amb.ilum.potencia === null || amb.ilum.potencia === undefined) amb.ilum.potencia = H.motor.adotados(amb, E.projeto).ilumInstalada;
        }
        K.acoes.definir(el);
      },
      'add-equip': function () { var E = proj(); K.alterar('amb.' + U.amb + '.nome', function () { E.ambientes[U.amb].equip.push({ item: H.dados.tab.equipamentos[0].nome, qtd: 1, w: null, fu: null }); }); },
      'somb-tipo': function (el) {    // troca o tipo do sombreamento (cascata): grava o nome padrão do tipo; sair de "Valores do fabricante" zera IAC e FR
        var S = H.motor.formato.somb, tipo = el.getAttribute('data-valor');
        K.alterar(el.getAttribute('data-caminho'), function (t) {
          var antes = S.decompor(t.o[t.k]).tipo;
          t.o[t.k] = S.PADRAO_TIPO[tipo];
          if (antes === 'fabricante' && tipo !== 'fabricante') { t.o.sombIac = null; t.o.sombFr = null; }
        });
      },
      'somb-opc': function (el) {     // cor, posição ou trama: recompõe o nome da lista a partir do nome gravado
        var S = H.motor.formato.somb, campo = el.getAttribute('data-campo'), v = el.getAttribute('data-valor');
        K.alterar(el.getAttribute('data-caminho'), function (t) {
          var d = S.decompor(t.o[t.k]);
          if (campo === 'voil') d.voil = v === '1'; else d[campo] = v;
          t.o[t.k] = S.compor(d.tipo, d);
        });
      },
      'del-equip': function (el) { var E = proj(); K.alterar('amb.' + U.amb + '.nome', function () { E.ambientes[U.amb].equip.splice(+el.getAttribute('data-j'), 1); }); },
      'novo-amb': function () { K.janela(T.janelaModelos()); },
      'criar-amb': function (el) {
        var E = proj();
        E.ambientes.push(H.dados.exemplo.deModelo(el.getAttribute('data-recinto')));
        U.sobre = null; U.aberto = { geo: true }; K.guardar();
        location.hash = '#/ambiente/' + (E.ambientes.length - 1);
      },
      duplicar: function (el) { duplicar(+el.getAttribute('data-amb')); },
      excluir: function (el) {
        var E = proj(), i = +el.getAttribute('data-amb');
        if (E.ambientes.length > 1 && window.confirm('Excluir o ambiente “' + E.ambientes[i].nome + '”?')) { E.ambientes.splice(i, 1); U.delta = 0; K.guardar(); }
      }
    }
  };

  // Leitura do gráfico de 24 h: cursor e valores da hora sob o ponteiro
  document.addEventListener('mousemove', function (ev) {
    var caixa = document.getElementById('graf-caixa');
    if (!caixa) return;
    var dica = document.getElementById('graf-dica'), cursor = document.getElementById('graf-cursor');
    var r = caixa.getBoundingClientRect(), L = +caixa.getAttribute('data-l'), me = +caixa.getAttribute('data-me'), md = +caixa.getAttribute('data-md');
    var xs = (ev.clientX - r.left) / r.width * L;
    if (ev.clientY < r.top || ev.clientY > r.bottom || xs < me - 6 || xs > L - md + 6) { dica.className = 'dica oculto'; cursor.setAttribute('class', 'cursor oculto'); return; }
    var h = Math.min(24, Math.max(1, Math.round((xs - me) / (L - me - md) * 23) + 1)), cj = H.motor.conjunto(proj());
    var xh = me + (h - 1) / 23 * (L - me - md);
    cursor.setAttribute('x1', xh); cursor.setAttribute('x2', xh); cursor.setAttribute('class', 'cursor');
    dica.className = 'dica';
    dica.style.left = Math.min(Math.max(xh / L * r.width, 90), r.width - 90) + 'px';
    dica.style.top = '34px';
    dica.innerHTML = '<b>' + h + ' h</b> · capacidade ' + f.num(cj.sistema.series.cap[h - 1], 0) + ' W · carga do ambiente ' + f.num(cj.total[h - 1], 0) + ' W';
  });
})(window.HVAC);

</script>
<script>window.HVAC.ui.iniciar();</script>
